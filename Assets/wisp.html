<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisp Proxy Fetcher</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #121212;
      color: #e0e0e0;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    label { font-weight: 600; font-size: 0.9rem; color: #aaa; }
    input {
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    pre {
      background: #1e1e1e;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      max-height: 400px;
      border: 1px solid #333;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h1>Wisp Fetch Client</h1>

  <div class="form-group">
    <label for="wispServer">Wisp WebSocket Server URL</label>
    <input type="text" id="wispServer" value="wss://wisp.mercuryworkshop.sub.id/" placeholder="wss://your-wisp-server.com/">
  </div>

  <div class="form-group">
    <label for="targetUrl">Target Request URL (API / Endpoint)</label>
    <input type="text" id="targetUrl" value="https://api.invidious.io/api/v1/stats" placeholder="https://api.example.com/endpoint">
  </div>

  <button id="fetchBtn">Fetch via Wisp</button>

  <h3>Response</h3>
  <pre id="output">Enter a Wisp server and target URL, then click fetch.</pre>

  <script type="module">
    // Import directly as an ES module via jsDelivr +esm endpoint
    import { WispConnection } from 'https://cdn.jsdelivr.net/npm/@mercuryworkshop/wisp-webconn@latest/+esm';

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const output = document.getElementById('output');
      const wispServer = document.getElementById('wispServer').value.trim();
      const targetUrl = document.getElementById('targetUrl').value.trim();
      const btn = document.getElementById('fetchBtn');

      if (!wispServer || !targetUrl) {
        output.textContent = 'Please provide both a valid Wisp server URL and a target request URL.';
        return;
      }

      btn.disabled = true;
      output.textContent = 'Connecting to Wisp proxy backend...';

      try {
        const connection = new WispConnection(wispServer);
        await connection.connect();

        output.textContent = `Connected! Fetching target: ${targetUrl}...`;

        const response = await connection.fetch(targetUrl, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        const status = `${response.status} ${response.statusText}`;
        const content = await response.text();

        let formattedContent = content;
        try {
          formattedContent = JSON.stringify(JSON.parse(content), null, 2);
        } catch (e) {
        }

        output.textContent = `HTTP Status: ${status}\n\n--- Body Output ---\n${formattedContent}`;
      } catch (err) {
        output.textContent = `Error: ${err.message || err}`;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
