<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisp Proxy Fetch</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #121212; color: #e0e0e0; }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        input[type="text"] { padding: 8px; width: 300px; background: #1e1e1e; border: 1px solid #333; color: white; border-radius: 4px; }
        button { padding: 8px 16px; cursor: pointer; background: #3b82f6; border: none; color: white; border-radius: 4px; font-weight: bold; }
        button:hover { background: #2563eb; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-x: auto; max-height: 400px; }
        #media-container { margin-top: 15px; }
        img, video, audio { max-width: 100%; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Wisp Proxy Client</h1>
    
    <div class="controls">
        <input type="text" id="url-input" value="https://example.com" placeholder="Enter URL..." />
        <button id="run-text">Fetch Text/HTML</button>
        <button id="run-media">Fetch Media</button>
        <button id="run-post">Test POST</button>
    </div>
    
    <div id="media-container"></div>
    <pre id="output">Waiting...</pre>

    <script type="module">
        import { EpoxyClient } from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/+esm";

        const output = document.getElementById("output");
        const mediaContainer = document.getElementById("media-container");
        const urlInput = document.getElementById("url-input");

        let client;
        try {
            client = new EpoxyClient({ wisp: "wss://frogiesarcade.win/1t4un0/" });
            output.textContent = "Client ready! Select an action.";
        } catch (err) {
            output.textContent = "Failed to initialize Wisp client: " + err;
        }

        function setStatus(text) {
            output.textContent = text;
            mediaContainer.innerHTML = '';
        }

        document.getElementById("run-text").addEventListener("click", async () => {
            if (!client) return;
            setStatus("Fetching text...");
            
            try {
                const response = await client.fetch(urlInput.value);
                output.textContent = await response.text();
            } catch (err) {
                output.textContent = "Error: " + err.toString();
            }
        });

        document.getElementById("run-media").addEventListener("click", async () => {
            if (!client) return;
            setStatus("Fetching media...");

            try {
                const response = await client.fetch(urlInput.value);
                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                const contentType = response.headers.get("content-type") || "";

                if (contentType.startsWith("audio/")) {
                    const audio = document.createElement("audio");
                    audio.controls = true;
                    audio.src = objectUrl;
                    mediaContainer.appendChild(audio);
                } else if (contentType.startsWith("video/")) {
                    const video = document.createElement("video");
                    video.controls = true;
                    video.src = objectUrl;
                    mediaContainer.appendChild(video);
                } else if (contentType.startsWith("image/")) {
                    const img = document.createElement("img");
                    img.src = objectUrl;
                    mediaContainer.appendChild(img);
                } else {
                    const link = document.createElement("a");
                    link.href = objectUrl;
                    link.download = "downloaded_file";
                    link.textContent = `Download File (${contentType})`;
                    mediaContainer.appendChild(link);
                }
                
                output.textContent = `Media loaded. Type: ${contentType}, Size: ${blob.size} bytes`;
            } catch (err) {
                output.textContent = "Error: " + err.toString();
            }
        });

        document.getElementById("run-post").addEventListener("click", async () => {
            if (!client) return;
            setStatus("Sending POST...");

            try {
                const payload = JSON.stringify({ message: "Hello", wisp: true });
                const encodedBody = new TextEncoder().encode(payload);

                const response = await client.fetch("https://httpbin.org/post", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json" 
                    },
                    body: encodedBody
                });
                
                const json = await response.json();
                output.textContent = JSON.stringify(json, null, 2);
            } catch (err) {
                output.textContent = "Error: " + err.toString();
            }
        });
    </script>
</body>
</html>
