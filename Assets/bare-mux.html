<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisp Proxy Fetch</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        input[type="text"] { padding: 8px; width: 300px; }
        button { padding: 8px 16px; cursor: pointer; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-x: auto; max-height: 400px; }
        #media-container { margin-top: 15px; }
        img, video, audio { max-width: 100%; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Wisp Proxy Client</h1>
    
    <div class="controls">
        <input type="text" id="url-input" value="https://example.com" placeholder="Enter URL..." />
        <button id="run-text">Fetch Text/HTML</button>
        <button id="run-media">Fetch Media</button>
        <button id="run-post">Test POST</button>
    </div>
    
    <div id="media-container"></div>
    <pre id="output">Waiting...</pre>

    <script type="module">
        import { BareMuxConnection, BareClient } from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.1.9/+esm";

        const output = document.getElementById("output");
        const mediaContainer = document.getElementById("media-container");
        const urlInput = document.getElementById("url-input");

        async function setupProxy() {
            try {
                const workerCode = `importScripts("https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.1.9/dist/worker.js");`;
                const blob = new Blob([workerCode], { type: "text/javascript" });
                const workerUrl = URL.createObjectURL(blob);

                const conn = new BareMuxConnection(workerUrl);

                await conn.setTransport(
                    "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs",
                    [{ wisp: "wss://frogiesarcade.win/1t4un0/" }]
                );
                
                return new BareClient();
            } catch (err) {
                output.textContent = err;
                return null;
            }
        }

        const clientPromise = setupProxy();

        document.getElementById("run-text").addEventListener("click", async () => {
            const client = await clientPromise;
            if (!client) return;

            output.textContent = "Fetching text...";
            mediaContainer.innerHTML = '';
            
            try {
                const response = await client.fetch(urlInput.value);
                output.textContent = await response.text();
            } catch (err) {
                output.textContent = err;
            }
        });

        document.getElementById("run-media").addEventListener("click", async () => {
            const client = await clientPromise;
            if (!client) return;

            output.textContent = "Fetching media...";
            mediaContainer.innerHTML = '';

            try {
                const response = await client.fetch(urlInput.value);
                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                const contentType = response.headers.get("content-type") || "";

                if (contentType.startsWith("audio/")) {
                    const audio = document.createElement("audio");
                    audio.controls = true;
                    audio.src = objectUrl;
                    mediaContainer.appendChild(audio);
                } else if (contentType.startsWith("video/")) {
                    const video = document.createElement("video");
                    video.controls = true;
                    video.src = objectUrl;
                    mediaContainer.appendChild(video);
                } else if (contentType.startsWith("image/")) {
                    const img = document.createElement("img");
                    img.src = objectUrl;
                    mediaContainer.appendChild(img);
                } else {
                    const link = document.createElement("a");
                    link.href = objectUrl;
                    link.download = "downloaded_file";
                    link.textContent = `Download File (${contentType})`;
                    mediaContainer.appendChild(link);
                }
                
                output.textContent = `Media loaded. Type: ${contentType}, Size: ${blob.size} bytes`;
            } catch (err) {
                output.textContent = err;
            }
        });

        document.getElementById("run-post").addEventListener("click", async () => {
            const client = await clientPromise;
            if (!client) return;

            output.textContent = "Sending POST...";
            mediaContainer.innerHTML = '';

            try {
                const payload = JSON.stringify({ message: "Hello", wisp: true });
                const encodedBody = new TextEncoder().encode(payload);

                const response = await client.fetch("https://httpbin.org/post", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json" 
                    },
                    body: encodedBody
                });
                
                const json = await response.json();
                output.textContent = JSON.stringify(json, null, 2);
            } catch (err) {
                output.textContent = err;
            }
        });
    </script>
</body>
</html>
