<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1216;
        }
        #content-frame {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="content-frame"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetSite = urlParams.get('site');
        const iframe = document.getElementById('content-frame');

        let proxyPort = null;

        window.addEventListener('message', (event) => {
            if (event.data === 'init-port' && event.ports && event.ports.length > 0) {
                proxyPort = event.ports[0];
                proxyPort.start();
            }
        });

        if (targetSite) {
            iframe.src = targetSite;
        }

        setInterval(() => {
            try {
                const win = iframe.contentWindow;
                if (!win) return;

                const currentTitle = win.document.title;
                const currentUrl = win.location.href;
                
                let currentFavicon = "";
                const iconElement = win.document.querySelector("link[rel*='icon']");
                if (iconElement && iconElement.href) {
                    currentFavicon = iconElement.href;
                }

                if (proxyPort) {
                    proxyPort.postMessage({
                        type: 'tabData',
                        title: currentTitle,
                        favicon: currentFavicon,
                        url: currentUrl
                    });
                }
            } catch (e) {
            }
        }, 100);
    </script>
</body>
</html>
