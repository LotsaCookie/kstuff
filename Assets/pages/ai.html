<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI</title>

<!-- Markdown / sanitize / code-highlight libs used by ai.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
  :root{
    --bg:#0c0c14;
    --panel:#13131e;
    --border:rgba(255,255,255,0.08);
    --text:#e8e8f0;
    --text-dim:rgba(255,255,255,0.5);
    --accent:#8b7cf6;
    --accent-dim:rgba(139,124,246,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}

  /* Launcher button (only needed if this page is embedded in a larger site) */
  #aiLauncherBtn{
    position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;
    background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;
    align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:1000;
  }

  /* Main AI panel */
  #aiScreen{
    position:fixed;inset:0;background:var(--bg);display:flex;
    opacity:0;pointer-events:none;transform:translateY(12px);
    transition:opacity .2s ease, transform .2s ease;
    z-index:2000;
  }
  #aiScreen.open{opacity:1;pointer-events:auto;transform:translateY(0);}

  /* Sidebar */
  #aiSidebar{
    width:260px;flex-shrink:0;border-right:1px solid var(--border);
    display:flex;flex-direction:column;background:var(--panel);
  }
  .ai-sidebar-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px;border-bottom:1px solid var(--border);
  }
  .ai-sidebar-title{font-weight:600;font-size:14px;}
  #aiNewChatBtn{
    background:var(--accent-dim);border:1px solid rgba(167,139,250,0.3);color:#cbb8ff;
    border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;
  }
  #aiNewChatBtn:hover{background:rgba(167,139,250,0.25);}
  #aiRecentsList{flex:1;overflow-y:auto;padding:8px;}
  .ai-recent-item{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-dim);
  }
  .ai-recent-item:hover{background:rgba(255,255,255,0.05);}
  .ai-recent-item.active{background:rgba(139,124,246,0.15);color:#fff;}
  .ai-recent-item-title{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;cursor:pointer;
  }
  .ai-recent-item-delete{
    background:none;border:none;color:var(--text-dim);cursor:pointer;padding:2px;
    display:flex;opacity:0;transition:opacity .15s;
  }
  .ai-recent-item:hover .ai-recent-item-delete{opacity:1;}
  .ai-recent-item-delete:hover{color:#ff6b6b;}
  .ai-recent-item-delete svg{width:14px;height:14px;}
  .ai-empty-state{padding:20px 10px;text-align:center;color:var(--text-dim);font-size:13px;}

  /* Main column */
  #aiMain{flex:1;display:flex;flex-direction:column;min-width:0;}
  .ai-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
  }
  #aiModelSelect{
    background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:6px 10px;font-size:13px;max-width:220px;
  }
  #aiStatus{
    font-size:12px;color:var(--text-dim);display:none;
  }
  #aiStatus.show{display:inline-block;}
  #aiCloseBtn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;
  }
  #aiCloseBtn:hover{color:#fff;}

  #aiChatContainer{flex:1;overflow-y:auto;padding:20px;}
  #aiMessages{
    max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  }

  #aiWelcome{
    max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;color:var(--text-dim);text-align:center;
  }
  #aiWelcome h2{color:#fff;margin:0;font-size:22px;}

  .ai-message{max-width:100%;}
  .ai-message.user{align-self:flex-end;margin-left:auto;max-width:80%;}
  .ai-message.user .ai-message-text{
    background:rgba(139,124,246,0.15);border:1px solid rgba(167,139,250,0.25);
    border-radius:14px;padding:10px 14px;
  }
  .ai-message.assistant .ai-message-text{font-size:15px;line-height:1.6;}
  .ai-message-text p{margin:0 0 10px;}
  .ai-message-text p:last-child{margin-bottom:0;}
  .ai-message-text pre{
    background:#08080e;border-radius:8px;padding:12px;overflow-x:auto;
  }
  .ai-message-text code{font-size:13px;}
  .ai-message-user-media{max-width:260px;border-radius:12px;display:block;margin-bottom:8px;}

  .ai-reasoning{margin-bottom:8px;}
  .ai-reasoning-summary{
    cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;
    color:var(--text-dim);font-size:12.5px;user-select:none;
  }
  .ai-reasoning-summary::-webkit-details-marker{display:none;}
  .ai-reasoning-chevron{width:14px;height:14px;transition:transform .15s;}
  details[open] .ai-reasoning-chevron{transform:rotate(90deg);}
  .ai-reasoning-body{
    font-size:12.5px;color:var(--text-dim);white-space:pre-wrap;padding:8px 0 0 20px;
    max-height:200px;overflow-y:auto;
  }

  .ai-message-media{max-width:420px;}
  .ai-message-status{font-size:12.5px;color:var(--text-dim);padding:2px 0;}
  .ai-message-stats{font-size:11px;color:rgba(255,255,255,0.3);margin-top:6px;}

  .ai-message-actions{display:flex;gap:4px;margin-top:6px;}
  .ai-message-action-btn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;
    border-radius:6px;display:flex;
  }
  .ai-message-action-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .ai-message-action-btn svg{width:14px;height:14px;}

  .ai-thinking-dots,.ai-blink-dots{display:flex;gap:4px;padding:6px 0;}
  .ai-typing-dot{
    width:6px;height:6px;border-radius:50%;background:var(--text-dim);
    animation:aiBlink 1.2s infinite ease-in-out;
  }
  .ai-typing-dot:nth-child(2){animation-delay:.15s;}
  .ai-typing-dot:nth-child(3){animation-delay:.3s;}
  @keyframes aiBlink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  /* Composer */
  #aiComposer{
    border-top:1px solid var(--border);padding:12px 16px 16px;flex-shrink:0;
  }
  .ai-composer-inner{
    max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:8px 10px;
  }
  #aiAttachPreview{
    display:none;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;
    background:rgba(255,255,255,0.04);border-radius:10px;
  }
  #aiAttachPreview.show{display:flex;}
  #aiAttachThumb{width:36px;height:36px;object-fit:cover;border-radius:6px;}
  #aiAttachName{
    flex:1;font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;
  }
  #aiAttachRemove{
    background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;line-height:1;
  }
  #aiAttachRemove:hover{color:#ff6b6b;}

  #aiInput{
    width:100%;resize:none;border:none;background:none;color:var(--text);
    font-family:inherit;font-size:14.5px;padding:8px 6px;max-height:110px;outline:none;
  }
  .ai-composer-row{display:flex;align-items:center;gap:6px;padding:0 4px;}
  .ai-composer-tool-btn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;padding:6px;
    border-radius:8px;display:flex;align-items:center;justify-content:center;
  }
  .ai-composer-tool-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .ai-composer-tool-btn.active{background:var(--accent-dim);color:#cbb8ff;}
  .ai-composer-spacer{flex:1;}
  #aiSendBtn{
    display:none;align-items:center;justify-content:center;width:34px;height:34px;
    background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;
  }
  #aiSendBtn:disabled{opacity:.5;cursor:default;}
  #aiImageInput{display:none;}

  @media (max-width:720px){
    #aiSidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);
      transition:transform .2s ease;z-index:10;}
    #aiSidebar.open{transform:translateX(0);}
  }
</style>
</head>
<body>

<!-- Optional floating launcher; remove if this panel is opened some other way -->
<button id="aiLauncherBtn" onclick="openAI()" title="Open AI">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/>
  </svg>
</button>

<div id="aiScreen">
  <div id="aiSidebar">
    <div class="ai-sidebar-header">
      <span class="ai-sidebar-title">Chats</span>
      <button id="aiNewChatBtn">New chat</button>
    </div>
    <div id="aiRecentsList"></div>
  </div>

  <div id="aiMain">
    <div class="ai-topbar">
      <select id="aiModelSelect"></select>
      <span id="aiStatus"></span>
      <button id="aiCloseBtn" onclick="closeAI()" title="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div id="aiChatContainer">
      <div id="aiWelcome">
        <h2>What can I help with?</h2>
        <p>Start typing below, or pick up a recent chat from the sidebar.</p>
      </div>
      <div id="aiMessages"></div>
    </div>

    <div id="aiComposer">
      <div class="ai-composer-inner">
        <div id="aiAttachPreview">
          <img id="aiAttachThumb" src="" alt="">
          <span id="aiAttachName"></span>
          <button id="aiAttachRemove" title="Remove attachment">&times;</button>
        </div>

        <textarea id="aiInput" rows="1" placeholder="Message AI…"></textarea>

        <div class="ai-composer-row">
          <button id="aiImageBtn" class="ai-composer-tool-btn" title="Attach image">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </button>
          <input type="file" id="aiImageInput" accept="image/png,image/jpeg,image/webp,image/gif">

          <button id="aiWebSearchBtn" class="ai-composer-tool-btn" title="Toggle web search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
          </button>

          <button id="aiScreenshareBtn" class="ai-composer-tool-btn" title="Screenshare (Picture-in-Picture)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 18v3"/>
            </svg>
          </button>

          <div class="ai-composer-spacer"></div>

          <button id="aiSendBtn" title="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12l7-7 7 7M12 19V5"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/lotsacookie/kstuff@main/Assets/pages/js/ai.js"></script>
</body>
</html>
