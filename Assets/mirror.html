<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Finder</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-x: auto; max-height: 200px; white-space: pre-wrap; }
        #result-container { margin-top: 15px; width: 100%; height: 75vh; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
   
    <div class="controls">
        <button id="find-mirror">Find Working Mirror</button>
    </div>
   
    <pre id="output">Initializing proxy...</pre>
    <div id="result-container"></div>

    <script type="module">
        import { BareMuxConnection, BareClient } from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.1.9/+esm";

        const output = document.getElementById("output");
        const resultContainer = document.getElementById("result-container");
        const findButton = document.getElementById("find-mirror");
        const STORAGE_KEY = "working_frogies_mirror";
        const TARGET_URL = "https://duckduckgo.com";

        function log(msg) {
            output.textContent += msg + "\n";
            output.scrollTop = output.scrollHeight; 
        }

        async function setupProxy() {
            try {
                const workerCode = `importScripts("https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.1.9/dist/worker.js");`;
                const blob = new Blob([workerCode], { type: "text/javascript" });
                const workerUrl = URL.createObjectURL(blob);

                const conn = new BareMuxConnection(workerUrl);

                await conn.setTransport(
                    "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs",
                    [{ wisp: "wss://wisp.mercurywork.shop/" }]
                );
               
                log("Proxy Ready! Click the button to start.");
                return new BareClient();
            } catch (err) {
                log("Error setting up proxy: " + err);
                return null;
            }
        }

        const clientPromise = setupProxy();

        function testUrl(baseUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                
                const cacheBuster = Date.now() + Math.random().toString(36).substring(7);
                
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                
                img.src = `${baseUrl}/stuff/logo.png?cb=${cacheBuster}`;
            });
        }

        function loadIframe(baseUrl) {
            resultContainer.innerHTML = `<iframe src="${baseUrl}/embed.html#${TARGET_URL}"></iframe>`;
        }

        findButton.addEventListener("click", async () => {
            const client = await clientPromise;
            if (!client) {
                log("Proxy failed to initialize.");
                return;
            }

            findButton.disabled = true;
            resultContainer.innerHTML = '';
            output.textContent = "Starting mirror check...\n";

            const savedMirror = localStorage.getItem(STORAGE_KEY);
            
            if (savedMirror) {
                log(`Found saved mirror: ${savedMirror}`);
                log(`Testing saved mirror...`);
                
                const isWorking = await testUrl(savedMirror);
                if (isWorking) {
                    log(`✅ Saved mirror is still working!`);
                    loadIframe(savedMirror);
                    findButton.disabled = false;
                    return;
                } else {
                    log(`❌ Saved mirror failed. Removing from cache and fetching new list...`);
                    localStorage.removeItem(STORAGE_KEY);
                }
            }

            const apiUrl = `https://getwebsiteclones.vercel.app/clones?url=frogiesarcade.win`;
            let cloneList = [];

            try {
                log(`Fetching URL list from proxy...`);
                const proxyResponse = await client.fetch(apiUrl);
               
                if (!proxyResponse.ok) {
                    throw new Error(`Proxy returned ${proxyResponse.status}`);
                }
                
                const data = await proxyResponse.text();
                cloneList = data.split('\n')
                                .map(line => line.trim())
                                .filter(line => line.startsWith('http'));
                
                log(`Successfully fetched ${cloneList.length} URLs to test.`);
            } catch (err) {
                log(`❌ Failed to fetch clone list: ${err.message}`);
                findButton.disabled = false;
                return;
            }

            let found = false;
            for (const url of cloneList) {
                log(`Testing: ${url}...`);
                const isWorking = await testUrl(url);
                
                if (isWorking) {
                    log(`✅ Found working mirror: ${url}`);
                    localStorage.setItem(STORAGE_KEY, url);
                    loadIframe(url);
                    found = true;
                    break; 
                } else {
                    log(`❌ Failed: ${url}`);
                }
            }

            if (!found) {
                log("⚠️ Exhausted all URLs. No working mirrors found.");
                resultContainer.textContent = "No working mirrors available right now.";
            }

            findButton.disabled = false;
        });
    </script>
</body>
</html>
