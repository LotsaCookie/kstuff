<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject width="100%" height="100%" x="0" y="0">
    <div xmlns="http://www.w3.org/1999/xhtml" id="launch-content" style="width:100%; height:100%; margin:0; padding:0; overflow:auto; box-sizing:border-box;"></div>
  </foreignObject>
  <script><![CDATA[
    var contentDiv = document.getElementById('launch-content');

    function post(msg) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(msg, '*');
      }
    }

    function executeScripts(container) {
      var scripts = Array.prototype.slice.call(container.querySelectorAll('script'));
      scripts.forEach(function (oldScript) {
        var newScript = document.createElement('script');
        for (var i = 0; i < oldScript.attributes.length; i++) {
          var attr = oldScript.attributes[i];
          newScript.setAttribute(attr.name, attr.value);
        }
        newScript.textContent = oldScript.textContent;
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    }

    function renderContent(htmlContent, baseUrl) {
      try {
        contentDiv.innerHTML = '';

        var parser = new DOMParser();
        var doc = parser.parseFromString(htmlContent || '', 'text/html');

        if (baseUrl) {
          var base = document.createElement('base');
          base.setAttribute('href', baseUrl);
          contentDiv.appendChild(base);
        }

        var headNodes = doc.head ? doc.head.querySelectorAll('style, link[rel="stylesheet"]') : [];
        for (var i = 0; i < headNodes.length; i++) {
          contentDiv.appendChild(headNodes[i].cloneNode(true));
        }

        var bodyWrap = document.createElement('div');
        bodyWrap.innerHTML = doc.body ? doc.body.innerHTML : (htmlContent || '');
        contentDiv.appendChild(bodyWrap);

        executeScripts(contentDiv);

        post({ type: 'content-loaded', source: 'launch-svg' });
      } catch (e) {
        post({ type: 'content-error', source: 'launch-svg', error: e && e.message ? e.message : String(e) });
      }
    }

    window.addEventListener('message', function (event) {
      var data = event.data;
      if (!data) return;

      if (typeof data === 'object' && data.type === 'CONTENT') {
        renderContent(data.html, data.baseUrl || '');
        return;
      }

      if (typeof data === 'string' && data.indexOf('CONTENT:') === 0) {
        renderContent(data.slice(8), '');
      }
    });

    post({ type: 'ready', source: 'launch-svg' });
  ]]></script>
</svg>
