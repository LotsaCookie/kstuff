    padding: 4px 6px 4px 14px;
    transition: all 0.2s ease;
}

.textbook-bar-container:focus-within {
    box-shadow: none;
}

    flex: 1;

    background: none;
    border: none;

    outline: none;
}

    color: var(--text-muted);
    font-weight: normal;
}

    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
}

.subject-action-btn { margin-right: 4px; }
.study-action-btn { margin-left: 4px; color: var(--text-color); }

.subject-action-btn:hover, .study-action-btn:hover {
    background-color: var(--surface-hover);
    color: var(--text-color);
}

.subject-action-btn svg, .study-action-btn svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
}

.campus-viewport {
    flex: 1;
    position: relative;
    background-color: transparent;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.campus-view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.campus-view.active {
    display: flex;
    opacity: 1;
    z-index: 2;
}

.library-home-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: transparent;
}

.library-home-title {
    font-size: 3.5rem;
    font-weight: 900 !important;
    letter-spacing: -0.01em;
    color: var(--text-color);
    margin-bottom: 8px;
    text-align: center;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
}

.library-home-quote {
    font-size: 1.05rem;
    font-weight: bold;
    font-style: italic;
    color: var(--text-muted);
    margin-bottom: 35px;
    text-align: center;
    max-width: 500px;
    min-height: 24px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
}

.flashcards-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    width: 100%;
    max-width: 650px;
    margin-bottom: 30px;
    max-height: 260px;
    overflow-y: auto;
    padding: 10px;
}

.flashcard-card {
    width: 80px;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: center;
}

.flashcard-card:hover {
    transform: translateY(-4px);
}

.flashcard-icon-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    width: 100%;
}

.flashcard-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background-color: var(--card-bg, rgba(255, 255, 255, 0.1));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.flashcard-icon img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    border-radius: 6px;
}

.flashcard-card:hover .flashcard-icon {
    background-color: var(--surface-hover);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
}

.remove-flashcard-btn {
    position: absolute;
    top: -5px;
    right: 3px;
    background: var(--nav-bg, #27272a);
    border: none;
    color: var(--text-muted);
    width: 20px;
    height: 20px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 900 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: all 0.2s ease;
    z-index: 2;
}

.flashcard-card:hover .remove-flashcard-btn {
    opacity: 1;
}

.remove-flashcard-btn:hover {
    background-color: #ef4444;
    color: #ffffff;
}

.flashcard-name {
    font-size: 0.8rem;
    color: var(--text-color);
    font-weight: 900 !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}

.add-flashcard-btn {
    background-color: var(--surface-color);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: none;
    color: var(--text-color);
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 900 !important;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
}

    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.campus-view.active {
    display: flex;
    opacity: 1;
    z-index: 2;
}

.library-home-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: transparent;
}

.library-home-title {
    font-size: 3.5rem;
    font-weight: 900 !important;
    letter-spacing: -0.01em;
    color: var(--text-color);
    margin-bottom: 8px;
    text-align: center;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
}

.library-home-quote {
    font-size: 1.05rem;
    font-weight: bold;
    font-style: italic;
    color: var(--text-muted);
    margin-bottom: 35px;
    text-align: center;
    max-width: 500px;
    min-height: 24px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
}

.flashcards-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    width: 100%;
    max-width: 650px;
    margin-bottom: 30px;
    max-height: 260px;
    overflow-y: auto;
    padding: 10px;
}

.flashcard-card {
    width: 80px;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: center;
}

.flashcard-card:hover {
    transform: translateY(-4px);
}

.flashcard-icon-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    width: 100%;
}

.flashcard-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background-color: var(--card-bg, rgba(255, 255, 255, 0.1));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.flashcard-icon img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    border-radius: 6px;
}

.flashcard-card:hover .flashcard-icon {
    background-color: var(--surface-hover);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
}

.remove-flashcard-btn {
    position: absolute;
    top: -5px;
    right: 3px;
    background: var(--nav-bg, #27272a);
    border: none;
    color: var(--text-muted);
    width: 20px;
    height: 20px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 900 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: all 0.2s ease;
    z-index: 2;
}

.flashcard-card:hover .remove-flashcard-btn {
    opacity: 1;
}

.remove-flashcard-btn:hover {
    background-color: #ef4444;
    color: #ffffff;
}

.flashcard-name {
    font-size: 0.8rem;
    color: var(--text-color);
    font-weight: 900 !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}

.add-flashcard-btn {
    background-color: var(--surface-color);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: none;
    color: var(--text-color);
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 900 !important;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
}

.add-flashcard-btn:hover {
    background-color: var(--surface-hover);
}

.study-iframe {
    width: 100%;
    height: 100%;
    border: none;
    background-color: transparent;
    display: none;
}

.exam-modal-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
}

.exam-modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.exam-modal-content {
    background: var(--nav-bg, rgba(24, 24, 27, 0.95));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: none;
    padding: 24px;
    border-radius: 12px;
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    transform: scale(0.9);
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.exam-modal-overlay.active .exam-modal-content {
    transform: scale(1);
}

.exam-modal-header {
    font-size: 1.05rem;
    font-weight: 900 !important;
    color: var(--text-color);
}

.exam-input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.exam-input-group label {
    font-size: 0.75rem;
    font-weight: 900 !important;
    color: var(--text-muted);
}

.exam-input {
    background: var(--card-bg, rgba(0,0,0,0.2));
    border: none;
    color: var(--text-color);
    padding: 10px;
    border-radius: 8px;
    outline: none;
    font-size: 0.9rem;
    font-weight: bold;
    transition: all 0.2s ease;
}

.exam-input:focus {
    background: rgba(0, 0, 0, 0.3);
}

.exam-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
}

.exam-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 900 !important;
    font-size: 0.85rem;
    transition: all 0.2s ease;
}

.exam-btn-cancel {
    background: var(--surface-color);
    color: var(--text-muted);
}

.exam-btn-cancel:hover {
    color: var(--text-color);
    background: var(--surface-hover);
}

.exam-btn-save {
    background: var(--text-color);
    color: var(--bg-color, #000000);
}

.exam-btn-save:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}
    </style>
</head>
<body>

    <div class="reading-corner" id="reading-corner">
        <div id="worksheets-container" style="display: flex; gap: 6px; flex: 1; overflow-x: auto;"></div>
        <button class="new-worksheet-btn" id="new-worksheet-plus-btn" title="New Tab">+</button>
    </div>

    <header class="learning-header">
        <button class="study-nav-btn" id="study-back-btn" title="Go Back" disabled>
            <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
        </button>
        <button class="study-nav-btn" id="study-forward-btn" title="Go Forward" disabled>
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
        </button>
        <button class="study-nav-btn" id="home-study-btn" title="Library Home Page">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
        <button class="study-nav-btn" id="reload-study-btn" title="Reload Tab">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        
        <div class="textbook-bar-container">
            <input type="text" class="textbook-input" id="textbook-input" placeholder="Enter URL or search..." />
            <button class="subject-action-btn" id="flashcard-shortcut-btn" title="Add Shortcut">
                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            </button>
            <button class="study-action-btn" id="study-enter-btn" title="Enter">
                <svg viewBox="0 0 24 24"><path d="M4 11v2h12l-5.5 5.5 1.42 1.42L19.84 12l-7.92-7.92L10.5 5.5 16 11H4z"/></svg>
            </button>
        </div>
    </header>

    <div class="campus-viewport" id="campus-viewport"></div>

    <div class="exam-modal-overlay" id="exam-modal">
        <div class="exam-modal-content">
            <div class="exam-modal-header">Add Shortcut</div>
            <div class="exam-input-group">
                <label>Name</label>
                <input type="text" class="exam-input" id="exam-name-input" placeholder="e.g. Science" />
            </div>
            <div class="exam-input-group">
                <label>URL</label>
                <input type="text" class="exam-input" id="exam-url-input" placeholder="https://..." />
            </div>
            <div class="exam-actions">
                <button class="exam-btn exam-btn-cancel" id="exam-cancel-btn">Cancel</button>
                <button class="exam-btn exam-btn-save" id="exam-save-btn">Done</button>
            </div>
        </div>
    </div>
 <script>
let mathWorksheets = [];
let activeWorksheetId = null;
let nextWorksheetId = 1;
let cachedQuote = "";

let flashcards = JSON.parse(localStorage.getItem('study_flashcards')) || [
    { name: 'DuckDuckGo', url: 'https://duckduckgo.com' },
    { name: 'now.gg', url: 'https://now.gg' },
    { name: 'Realtime HTML', url: 'https://realtimehtml.com' }
];

// Reusable Flashcard Helper
function addFlashcard(name, url) {
    if (!name || !url) return;
    flashcards.push({ name, url });
    localStorage.setItem('study_flashcards', JSON.stringify(flashcards));
    refreshAllFlashcards();
}

// Reusable URL Formatter
function formatUrl(rawUrl, allowSearch = false) {
    let validUrl = rawUrl.trim();
    if (!validUrl) return '';
    if (validUrl.startsWith('http://') || validUrl.startsWith('https://')) return validUrl;
    
    if (allowSearch && (!validUrl.includes('.') || validUrl.includes(' '))) {
        return 'https://www.google.com/search?q=' + encodeURIComponent(validUrl);
    }
    return 'https://' + validUrl;
}

const worksheetsContainer = document.getElementById('worksheets-container');
const campusViewport = document.getElementById('campus-viewport');
const textbookInput = document.getElementById('textbook-input');
const studyEnterBtn = document.getElementById('study-enter-btn');
const reloadStudyBtn = document.getElementById('reload-study-btn');
const homeStudyBtn = document.getElementById('home-study-btn');
const flashcardShortcutBtn = document.getElementById('flashcard-shortcut-btn');
const newWorksheetPlusBtn = document.getElementById('new-worksheet-plus-btn');
const studyBackBtn = document.getElementById('study-back-btn');
const studyForwardBtn = document.getElementById('study-forward-btn');
const examModal = document.getElementById('exam-modal');
const examNameInput = document.getElementById('exam-name-input');
const examUrlInput = document.getElementById('exam-url-input');
const examSaveBtn = document.getElementById('exam-save-btn');
const examCancelBtn = document.getElementById('exam-cancel-btn');

let currentModalCallback = null;

async function fetchLatestQuote() {
    try {
        const commitData = await (await fetch('https://api.github.com/repos/lotsacookie/kstuff/commits/main')).json();
        const messages = await (await fetch(`https://cdn.jsdelivr.net/gh/lotsacookie/kstuff@${commitData.sha || 'main'}/Json/messages.json`)).json();
        
        if (Array.isArray(messages) && messages.length > 0) {
            cachedQuote = `"${messages[Math.floor(Math.random() * messages.length)]}"`;
            document.querySelectorAll('.library-home-quote').forEach(el => el.textContent = cachedQuote);
        }
    } catch (err) {
        console.warn('Could not load random quote:', err);
    }
}
fetchLatestQuote();

function openExamModal(defaultName, defaultUrl, callback) {
    examNameInput.value = defaultName || '';
    examUrlInput.value = defaultUrl || '';
    currentModalCallback = callback;
    examModal.classList.add('active');
    examNameInput.focus();
}

function closeExamModal() {
    examModal.classList.remove('active');
    currentModalCallback = null;
}

examSaveBtn.addEventListener('click', () => {
    if (currentModalCallback) currentModalCallback(examNameInput.value.trim(), examUrlInput.value.trim());
    closeExamModal();
});
examCancelBtn.addEventListener('click', closeExamModal);

function updateNavButtons() {
    if (activeWorksheetId === null) return;
    const worksheet = mathWorksheets.find(w => w.id === activeWorksheetId);
    if (!worksheet) return;
    
    studyBackBtn.disabled = worksheet.historyIndex <= 0;
    studyForwardBtn.disabled = worksheet.historyIndex >= worksheet.history.length - 1;
}

function createMathWorksheet(initialUrl = '') {
    const worksheetId = nextWorksheetId++;
    const worksheetEl = document.createElement('div');
    worksheetEl.className = 'math-worksheet';
    worksheetEl.dataset.id = worksheetId;
    worksheetEl.innerHTML = `
        <img class="worksheet-icon" src="" alt="" style="display: none;" />
        <span class="worksheet-label">New Tab</span>
        <button class="worksheet-close" title="Close Tab">&times;</button>
    `;

    const viewEl = document.createElement('div');
    viewEl.className = 'campus-view';
    viewEl.dataset.id = worksheetId;
    // FIX: Replaced initialUrl || '' with initialUrl || 'about:blank' to stop parent page flickering
    viewEl.innerHTML = `
        <div class="library-home-page" style="display: ${initialUrl ? 'none' : 'flex'};">
            <h1 class="library-home-title">K-STUFF</h1>
            <p class="library-home-quote">${cachedQuote}</p>
            <div class="flashcards-container"></div>
            <button class="add-flashcard-btn"><span>+</span> Create Shortcut</button>
        </div>
        <iframe class="study-iframe" src="${initialUrl || 'about:blank'}" style="display: ${initialUrl ? 'block' : 'none'};"></iframe>
    `;

    const worksheet = {
        id: worksheetId,
        title: 'New Tab',
        url: initialUrl,
        mode: initialUrl ? 'iframe' : 'library',
        iframeSrc: initialUrl,
        history: [initialUrl || ''],
        historyIndex: 0,
        isNavigating: false,
        elements: {
            tab: worksheetEl,
            view: viewEl,
            label: worksheetEl.querySelector('.worksheet-label'),
            icon: worksheetEl.querySelector('.worksheet-icon'),
            iframe: viewEl.querySelector('.study-iframe'),
            library: viewEl.querySelector('.library-home-page')
        }
    };

    mathWorksheets.push(worksheet);

    worksheetEl.addEventListener('click', (e) => {
        if (!e.target.classList.contains('worksheet-close')) switchMathWorksheet(worksheetId);
    });

    worksheetEl.querySelector('.worksheet-close').addEventListener('click', () => closeMathWorksheet(worksheetId));

    worksheetsContainer.appendChild(worksheetEl);
    
    // Setup Library Page
    const flashcardContainer = viewEl.querySelector('.flashcards-container');
    renderFlashcardsForView(flashcardContainer, worksheetId);
    viewEl.querySelector('.add-flashcard-btn').addEventListener('click', () => openExamModal('', '', addFlashcard));

    campusViewport.appendChild(viewEl);
    switchMathWorksheet(worksheetId);
    
    if (initialUrl) loadUrlInMathWorksheet(worksheetId, initialUrl, false, true);
}

function renderFlashcardsForView(container, worksheetId) {
    container.innerHTML = '';
    flashcards.forEach((fc, index) => {
        const card = document.createElement('div');
        card.className = 'flashcard-card';
        
        let faviconUrl = '';
        try { faviconUrl = `https://www.google.com/s2/favicons?domain=${new URL(formatUrl(fc.url)).hostname}&sz=64`; } catch(e) {}

        card.innerHTML = `
            <div class="flashcard-icon-wrapper">
                <button class="remove-flashcard-btn" title="Remove Shortcut">&times;</button>
                <div class="flashcard-icon">
                    ${faviconUrl ? `<img src="${faviconUrl}" alt="${fc.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" /><span style="display:none;">${fc.name.charAt(0).toUpperCase()}</span>` : `<span>${fc.name.charAt(0).toUpperCase()}</span>`}
                </div>
            </div>
            <span class="flashcard-name" title="${fc.name}">${fc.name}</span>
        `;

        card.querySelector('.remove-flashcard-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            flashcards.splice(index, 1);
            localStorage.setItem('study_flashcards', JSON.stringify(flashcards));
            refreshAllFlashcards();
        });

        card.addEventListener('click', () => loadUrlInMathWorksheet(worksheetId, fc.url, true));
        container.appendChild(card);
    });
}

function refreshAllFlashcards() {
    mathWorksheets.forEach(w => {
        const container = w.elements.view.querySelector('.flashcards-container');
        if (container) renderFlashcardsForView(container, w.id);
    });
}

function switchMathWorksheet(worksheetId) {
    activeWorksheetId = worksheetId;
    mathWorksheets.forEach(w => {
        const isActive = w.id === worksheetId;
        w.elements.tab.classList.toggle('active', isActive);
        w.elements.view.classList.toggle('active', isActive);
        if (isActive) textbookInput.value = w.mode === 'iframe' ? w.url : '';
    });
    updateNavButtons();
}

function closeMathWorksheet(worksheetId) {
    const index = mathWorksheets.findIndex(w => w.id === worksheetId);
    if (index === -1) return;

    const [removed] = mathWorksheets.splice(index, 1);
    removed.elements.tab.remove();
    removed.elements.view.remove();

    if (mathWorksheets.length === 0) {
        createMathWorksheet();
    } else if (activeWorksheetId === worksheetId) {
        switchMathWorksheet(mathWorksheets[Math.max(0, index - 1)].id);
    }
}

function loadUrlInMathWorksheet(worksheetId, inputVal, updateInput = true, isHistoryNav = false) {
    if (!inputVal) return;
    const targetUrl = formatUrl(inputVal, true);
    const worksheet = mathWorksheets.find(w => w.id === worksheetId);
    if (!worksheet) return;

    worksheet.url = targetUrl;
    worksheet.mode = 'iframe';
    worksheet.iframeSrc = targetUrl;
    worksheet.isNavigating = true;

    if (!isHistoryNav && worksheet.history[worksheet.historyIndex] !== targetUrl) {
        worksheet.history = worksheet.history.slice(0, worksheet.historyIndex + 1);
        worksheet.history.push(targetUrl);
        worksheet.historyIndex++;
    }

    try {
        const domain = new URL(targetUrl).hostname;
        worksheet.title = domain;
        worksheet.elements.label.textContent = domain;
    } catch (e) {
        worksheet.title = targetUrl;
    }

    const iframe = worksheet.elements.iframe;
    iframe.onload = () => {
        worksheet.isNavigating = false;
        try {
            if (iframe.contentDocument?.title) {
                worksheet.title = iframe.contentDocument.title;
                worksheet.elements.label.textContent = worksheet.title;
            }
            const iconLink = iframe.contentDocument?.querySelector("link[rel*='icon']");
            if (iconLink?.href) {
                worksheet.elements.icon.src = iconLink.href;
                worksheet.elements.icon.style.display = 'block';
            }
        } catch (err) {} // Ignore CORS errors
    };

    worksheet.elements.library.style.display = 'none';
    iframe.style.display = 'block';
    iframe.src = targetUrl;

    if (updateInput && activeWorksheetId === worksheetId) textbookInput.value = targetUrl;
    updateNavButtons();
}

function showLibraryPageForActiveWorksheet(isHistoryNav = false) {
    const worksheet = mathWorksheets.find(w => w.id === activeWorksheetId);
    if (!worksheet) return;

    worksheet.mode = 'library';
    worksheet.url = '';
    worksheet.title = 'New Tab';
    worksheet.iframeSrc = '';
    worksheet.isNavigating = false;

    if (!isHistoryNav && worksheet.history[worksheet.historyIndex] !== '') {
        worksheet.history = worksheet.history.slice(0, worksheet.historyIndex + 1);
        worksheet.history.push('');
        worksheet.historyIndex++;
    }

    worksheet.elements.label.textContent = 'New Tab';
    worksheet.elements.icon.style.display = 'none';
    worksheet.elements.iframe.style.display = 'none';
    
    // FIX: 'about:blank' prevents parent page from reloading inside the iframe
    worksheet.elements.iframe.src = 'about:blank'; 
    worksheet.elements.library.style.display = 'flex';

    textbookInput.value = '';
    updateNavButtons();
}

// Consolidated History Navigation
function navigateHistory(offset) {
    if (activeWorksheetId === null) return;
    const worksheet = mathWorksheets.find(w => w.id === activeWorksheetId);
    
    if (worksheet) {
        const newIndex = worksheet.historyIndex + offset;
        if (newIndex >= 0 && newIndex < worksheet.history.length) {
            worksheet.historyIndex = newIndex;
            const targetUrl = worksheet.history[newIndex];
            if (targetUrl === '') showLibraryPageForActiveWorksheet(true);
            else loadUrlInMathWorksheet(activeWorksheetId, targetUrl, true, true);
        }
    }
}

studyBackBtn.addEventListener('click', () => navigateHistory(-1));
studyForwardBtn.addEventListener('click', () => navigateHistory(1));

setInterval(() => {
    if (activeWorksheetId === null) return;
    const worksheet = mathWorksheets.find(w => w.id === activeWorksheetId);
    if (!worksheet || worksheet.mode !== 'iframe' || worksheet.isNavigating) return;

    try {
        const iframe = worksheet.elements.iframe;
        const currentLoc = iframe.contentWindow?.location?.href;
        
        if (currentLoc && currentLoc !== 'about:blank') {
            const getNorm = (u) => { try { return new URL(u).href; } catch(e) { return u; } };

            if (getNorm(currentLoc) !== getNorm(worksheet.url)) {
                worksheet.url = currentLoc;
                textbookInput.value = currentLoc;
                
                if (getNorm(worksheet.history[worksheet.historyIndex]) !== getNorm(currentLoc)) {
                    worksheet.history = worksheet.history.slice(0, worksheet.historyIndex + 1);
                    worksheet.history.push(currentLoc);
                    worksheet.historyIndex++;
                    updateNavButtons();
                }
            }
            if (iframe.contentDocument?.title) {
                worksheet.title = iframe.contentDocument.title;
                worksheet.elements.label.textContent = worksheet.title;
            }
        }
    } catch (e) {}
}, 1000);

newWorksheetPlusBtn.addEventListener('click', () => createMathWorksheet());
studyEnterBtn.addEventListener('click', () => { if (activeWorksheetId !== null) loadUrlInMathWorksheet(activeWorksheetId, textbookInput.value); });
textbookInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && activeWorksheetId !== null) loadUrlInMathWorksheet(activeWorksheetId, textbookInput.value); });

reloadStudyBtn.addEventListener('click', () => {
    const worksheet = mathWorksheets.find(w => w.id === activeWorksheetId);
    if (worksheet && worksheet.mode === 'iframe') {
        try { worksheet.elements.iframe.contentWindow.location.reload(); } 
        catch (e) { worksheet.elements.iframe.src = worksheet.elements.iframe.src; }
    }
});

homeStudyBtn.addEventListener('click', () => showLibraryPageForActiveWorksheet(false));

flashcardShortcutBtn.addEventListener('click', () => {
    const currentUrl = textbookInput.value;
    if (!currentUrl) return openExamModal('', '', addFlashcard);
    
    let defaultName = currentUrl;
    try { defaultName = new URL(currentUrl).hostname.replace('www.', ''); } catch(e) {}
    openExamModal(defaultName, currentUrl, addFlashcard);
});

createMathWorksheet();
 </script>
</body>
