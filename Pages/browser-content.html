<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Content</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
        #content-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="content-iframe"></iframe>

    <script>
        const iframe = document.getElementById('content-iframe');
        let historyStack = [];
        let historyIdx = -1;
        let currentTargetUrl = "";

        window.parent.postMessage({ type: 'READY' }, '*');

        function navigate(url, addToHistory = true) {
            currentTargetUrl = url;
            iframe.src = url;

            if (addToHistory) {
                if (historyStack[historyIdx] !== url) {
                    historyStack = historyStack.slice(0, historyIdx + 1);
                    historyStack.push(url);
                    historyIdx++;
                }
            }

            reportState(url);
        }

        function reportState(url) {
            let title = url;
            let favicon = '';
            try {
                if (iframe.contentDocument) {
                    if (iframe.contentDocument.title) {
                        title = iframe.contentDocument.title;
                    }
                    const iconLink = iframe.contentDocument.querySelector("link[rel*='icon']");
                    if (iconLink && iconLink.href) {
                        favicon = iconLink.href;
                    }
                }
            } catch (e) {}

            window.parent.postMessage({
                type: 'NAVIGATION_UPDATE',
                url: url,
                title: title,
                favicon: favicon,
                canGoBack: historyIdx > 0,
                canGoForward: historyIdx < historyStack.length - 1
            }, '*');
        }

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data) return;

            if (data.type === 'NAVIGATE') {
                navigate(data.url, true);
            } else if (data.type === 'GO_BACK') {
                if (historyIdx > 0) {
                    historyIdx--;
                    navigate(historyStack[historyIdx], false);
                }
            } else if (data.type === 'GO_FORWARD') {
                if (historyIdx < historyStack.length - 1) {
                    historyIdx++;
                    navigate(historyStack[historyIdx], false);
                }
            } else if (data.type === 'RELOAD') {
                if (iframe.src) {
                    iframe.src = iframe.src;
                }
            }
        });

        setInterval(() => {
            try {
                if (iframe.contentWindow && iframe.contentWindow.location) {
                    reportState(currentTargetUrl);
                }
            } catch (e) {}
        }, 300);
    </script>
</body>
</html>
