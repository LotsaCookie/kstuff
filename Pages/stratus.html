<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Scanner</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe id="mainIframe"></iframe>

    <script>
        const iframe = document.getElementById('mainIframe');
        
        const firstUrl = "https://cherrion.top/g";
        const targetUrl = "https://cherrion.top/l?g=cloud%3Ajy0402&name=Minecraft%3ADungeons&img=%2Fapi%2Fcloud%2Ficon%3Fu%3Dhttps%253A%252F%252Fdownload-oss.raccoongame.com%252Fuploads%252Fimage%252F20210402%252F20210402153935638.webp?$io=https://cherrion.top";
        
        let hasRedirected = false;

        iframe.onload = function() {
            if (!hasRedirected) {
                hasRedirected = true;
                console.log("Initial URL loaded. Navigating to target URL...");
                iframe.src = targetUrl;
                
                // Scan very frequently
                setInterval(scanIframe, 500);
            }
        };

        iframe.src = firstUrl;

        function scanIframe() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                if (!iframeDoc) return;

                let foundUrl = null;

                // STRATEGY 1: Check all iframe elements directly
                const nestedIframes = iframeDoc.querySelectorAll('iframe');
                for (let nested of nestedIframes) {
                    // Check both the resolved src and the raw attribute
                    let src = nested.src || nested.getAttribute('src');
                    if (src && src.includes('/api/cloud/embed')) {
                        foundUrl = src;
                        break;
                    }
                }

                // STRATEGY 2: If no iframe element found yet, search the raw text of the page
                if (!foundUrl && iframeDoc.documentElement) {
                    const rawHTML = iframeDoc.documentElement.innerHTML;
                    
                    // Regex looks for /api/cloud/embed followed by anything except quotes, spaces, or brackets
                    const regex = /(\/api\/cloud\/embed[^"'\s<>]+)/;
                    const match = rawHTML.match(regex);
                    
                    if (match && match[1]) {
                        foundUrl = match[1].replace(/\\\//g, '/'); // Clean escaped slashes if in a script
                    }
                }

                // If we found a URL through either strategy
                if (foundUrl) {
                    // If it's a relative URL (starts with /), attach the domain to it
                    if (foundUrl.startsWith('/')) {
                        foundUrl = "https://cherrion.top" + foundUrl;
                    }

                    // Navigate to it if we haven't already
                    if (iframe.src !== foundUrl) {
                        console.log('Found cloud embed URL:', foundUrl);
                        iframe.src = foundUrl;
                    }
                }

            } catch (error) {
                // Fails silently if navigating between origins
            }
        }
    </script>

</body>
</html>
