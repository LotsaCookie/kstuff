<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Scanner</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe id="mainIframe"></iframe>

    <script>
        const iframe = document.getElementById('mainIframe');
        
        const firstUrl = "https://cherrion.top/g";
        const targetUrl = "https://cherrion.top/l?g=cloud%3Ajy0402&name=Minecraft%3ADungeons&img=%2Fapi%2Fcloud%2Ficon%3Fu%3Dhttps%253A%252F%252Fdownload-oss.raccoongame.com%252Fuploads%252Fimage%252F20210402%252F20210402153935638.webp?$io=https://cherrion.top";
        
        let hasRedirected = false;

        iframe.onload = function() {
            if (!hasRedirected) {
                hasRedirected = true;
                console.log("Initial URL loaded. Navigating to target URL...");
                iframe.src = targetUrl;
                
                // Start scanning the live document every 500ms
                setInterval(scanIframe, 500);
            }
        };

        iframe.src = firstUrl;

        function scanIframe() {
            try {
                // This targets the live, constantly updating DOM inside the iframe
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                if (iframeDoc) {
                    // Grab EVERY iframe currently on the page
                    const allIframes = iframeDoc.querySelectorAll('iframe');

                    // Loop through them all to find the specific cloud embed
                    for (let nestedIframe of allIframes) {
                        if (nestedIframe.src && nestedIframe.src.includes('/api/cloud/embed')) {
                            const newUrl = nestedIframe.src;
                            
                            // Prevent infinite reloading
                            if (iframe.src !== newUrl) {
                                console.log('Found dynamic nested iframe URL!', newUrl);
                                iframe.src = newUrl;
                            }
                        }
                    }
                }
            } catch (error) {
                // If it fails silently here, it is because of the Same-Origin Policy
            }
        }
    </script>

</body>
</html>
