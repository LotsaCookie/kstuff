<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Iframe Scanner</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe id="mainIframe"></iframe>

    <script>
        const mainIframe = document.getElementById('mainIframe');
        
        const firstUrl = "https://cherrion.top/g";
        const targetUrl = "https://cherrion.top/l?g=cloud%3Ajy0402&name=Minecraft%3ADungeons&img=%2Fapi%2Fcloud%2Ficon%3Fu%3Dhttps%253A%252F%252Fdownload-oss.raccoongame.com%252Fuploads%252Fimage%252F20210402%252F20210402153935638.webp?$io=https://cherrion.top";
        
        let hasInitialized = false;

        mainIframe.onload = function() {
            if (!hasInitialized) {
                hasInitialized = true;
                console.log("Initial page loaded. Moving to target URL...");
                mainIframe.src = targetUrl;
            } else {
                console.log("Main iframe navigated. Continuing scan...");
            }
        };

        mainIframe.src = firstUrl;

        setInterval(() => {
            try {
                const iframeDoc = mainIframe.contentDocument || mainIframe.contentWindow.document;
                if (!iframeDoc) return;

                let foundUrl = searchWindowForUrl(mainIframe.contentWindow);

                if (foundUrl) {
                    // If it's a relative URL, prepend cherrion.top instead of the proxy domain
                    if (foundUrl.startsWith('/')) {
                        foundUrl = "https://cherrion.top" + foundUrl;
                    }

                    // Only update if it's a different URL to prevent loops
                    if (mainIframe.src !== foundUrl) {
                        console.log('Found target URL, updating mainIframe:', foundUrl);
                        mainIframe.src = foundUrl;
                    }
                }
            } catch (error) {
                // Suppress cross-origin warnings during transitions
            }
        }, 1000);

        function searchWindowForUrl(win) {
            try {
                const doc = win.document;
                if (!doc) return null;

                // Check iframe elements
                const nestedIframes = doc.querySelectorAll('iframe');
                for (let nested of nestedIframes) {
                    let src = nested.src || nested.getAttribute('src');
                    if (src && src.includes('/api/cloud/embed')) {
                        return src;
                    }
                }

                // Check raw HTML source
                if (doc.documentElement) {
                    const rawHTML = doc.documentElement.innerHTML;
                    const regex = /(\/api\/cloud\/embed[^"'\s<>]+)/;
                    const match = rawHTML.match(regex);
                    
                    if (match && match[1]) {
                        return match[1].replace(/\\\//g, '/');
                    }
                }

                // Check child frames recursively
                for (let i = 0; i < win.frames.length; i++) {
                    let foundDeep = searchWindowForUrl(win.frames[i]);
                    if (foundDeep) return foundDeep;
                }
            } catch (e) {
                // Ignore restricted frames
            }
            return null;
        }
    </script>

</body>
</html>
