<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe - Fast Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">StreamVibe 🎵</h1>
            <span id="apiStatus" class="text-xs text-indigo-400">System Ready</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto w-full p-4 flex-grow mb-36">
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="searchInput" placeholder="Search songs, artists, or albums..." 
                class="flex-grow bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
            <button onclick="performSearch()" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-3 rounded-xl transition">
                Search
            </button>
        </div>

        <div id="loading" class="hidden text-center py-12 text-slate-400 animate-pulse">
            Searching API Pool...
        </div>

        <div id="resultsList" class="space-y-3">
            <div class="text-center py-16 text-slate-600">
                Search for any track to instantly load results and stream!
            </div>
        </div>
    </main>

    <div id="playerContainer" class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 p-4 shadow-2xl z-50 hidden">
        <div class="max-w-3xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-3 w-full sm:w-auto overflow-hidden">
                <img id="playerThumb" src="" alt="Thumbnail" class="w-12 h-12 rounded-lg object-cover bg-slate-800 flex-shrink-0">
                <div class="overflow-hidden">
                    <h4 id="playerTitle" class="text-sm font-medium text-slate-100 truncate w-full sm:w-60">Title</h4>
                    <p id="playerAuthor" class="text-xs text-slate-400 truncate">Artist</p>
                </div>
            </div>
            
            <div class="w-full sm:w-auto flex-grow max-w-sm flex flex-col items-center">
                <audio id="audioPlayer" controls class="w-full h-10 accent-indigo-500"></audio>
                <div id="statusText" class="text-xs text-indigo-400 mt-1">Ready</div>
            </div>
        </div>
    </div>

    <script>
        class MusicApiPool {
            constructor() {
                this.providers = [
                    {
                        name: 'Audius',
                        search: async (query) => {
                            const nodesRes = await fetch('https://api.audius.co');
                            const nodes = await nodesRes.json();
                            const host = nodes.data[0];
                            
                            const res = await fetch(`${host}/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=StreamVibe`);
                            if (!res.ok) throw new Error("Audius search failed");
                            const json = await res.json();
                            
                            return json.data.map(t => ({
                                id: t.id,
                                title: t.title,
                                author: t.user.name,
                                thumb: t.artwork ? t.artwork['480x480'] : 'https://via.placeholder.com/300x300/1e293b/a5b4fc?text=No+Art',
                                provider: 'Audius',
                                streamUrl: `${host}/v1/tracks/${t.id}/stream?app_name=StreamVibe`
                            }));
                        }
                    },
                    {
                        name: 'Invidious (YouTube)',
                        search: async (query) => {
                            const instance = 'https://vid.puffyan.us'; 
                            const res = await fetch(`${instance}/api/v1/search?q=${encodeURIComponent(query)}`);
                            if (!res.ok) throw new Error("Invidious search failed");
                            const json = await res.json();
                            
                            return json.filter(v => v.type === 'video').map(v => ({
                                id: v.videoId,
                                title: v.title,
                                author: v.author,
                                thumb: v.videoThumbnails && v.videoThumbnails.length > 0 
                                    ? v.videoThumbnails.find(t => t.quality === 'medium')?.url || v.videoThumbnails[0].url 
                                    : 'https://via.placeholder.com/300x300/1e293b/a5b4fc?text=No+Art',
                                provider: 'Invidious',
                                // Extracts the raw audio stream without waiting for a conversion job
                                streamUrl: `${instance}/latest_version?id=${v.videoId}&itag=140` 
                            }));
                        }
                    }
                ];
            }

            async search(query) {
                const errors = [];
                for (const provider of this.providers) {
                    try {
                        console.log(`[API Pool] Searching via ${provider.name}...`);
                        const results = await provider.search(query);
                        if (results && results.length > 0) return results;
                    } catch (err) {
                        console.warn(`[API Pool] ${provider.name} failed:`, err);
                        errors.push(provider.name);
                    }
                }
                throw new Error(`All providers failed. Please try a different search term.`);
            }

            async getFallbackTrack(failedTrack) {
                const crossQuery = `${failedTrack.title} ${failedTrack.author}`;
                for (const provider of this.providers) {
                    if (provider.name === failedTrack.provider) continue;
                    
                    try {
                        const fallbackResults = await provider.search(crossQuery);
                        if (fallbackResults.length > 0) return fallbackResults[0];
                    } catch (e) {
                        continue;
                    }
                }
                throw new Error("No cross-provider fallback found.");
            }
        }

        const apiPool = new MusicApiPool();
        let currentTrack = null;

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const loading = document.getElementById('loading');
            const resultsList = document.getElementById('resultsList');
            const apiStatus = document.getElementById('apiStatus');
            
            loading.classList.remove('hidden');
            resultsList.innerHTML = '';
            apiStatus.innerText = "Searching API Pool...";

            try {
                const results = await apiPool.search(query);
                
                loading.classList.add('hidden');
                apiStatus.innerText = `${results.length} Tracks Found via ${results[0].provider}`;

                results.slice(0, 15).forEach(item => {
                    const card = document.createElement('div');
                    card.className = "flex items-center justify-between bg-slate-900/60 border border-slate-800/80 hover:border-slate-700 p-3 rounded-xl transition group";
                    
                    card.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden pr-2">
                            <img src="${item.thumb}" class="w-14 h-14 rounded-lg object-cover bg-slate-800 flex-shrink-0" alt="Thumb" onerror="this.src='https://via.placeholder.com/300x300/1e293b/a5b4fc?text=No+Art'">
                            <div class="overflow-hidden">
                                <h3 class="text-sm font-medium text-slate-200 group-hover:text-indigo-400 transition truncate">${item.title}</h3>
                                <p class="text-xs text-slate-400 truncate">${item.author} • <span class="text-[10px] uppercase tracking-wider text-slate-500">${item.provider}</span></p>
                            </div>
                        </div>
                        <button class="play-btn bg-slate-800 group-hover:bg-indigo-600 text-slate-300 group-hover:text-white px-4 py-2 rounded-lg text-xs font-semibold transition flex-shrink-0 flex items-center gap-1">
                            ▶ Play
                        </button>
                    `;
                    
                    card.querySelector('.play-btn').addEventListener('click', () => playTrack(item));
                    resultsList.appendChild(card);
                });

            } catch (error) {
                loading.classList.add('hidden');
                resultsList.innerHTML = `<p class="text-center text-red-400 py-10">${error.message}</p>`;
                apiStatus.innerText = "Search Error";
            }
        }

        async function playTrack(track) {
            currentTrack = track;
            
            const playerContainer = document.getElementById('playerContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            const statusText = document.getElementById('statusText');

            document.getElementById('playerThumb').src = track.thumb;
            document.getElementById('playerTitle').innerText = track.title;
            document.getElementById('playerAuthor').innerText = `${track.author} (${track.provider})`;
            
            playerContainer.classList.remove('hidden');
            
            statusText.innerText = `Buffering stream from ${track.provider}...`;
            audioPlayer.src = track.streamUrl;
            
            try {
                await audioPlayer.play();
                statusText.innerText = `Playing from ${track.provider}`;
            } catch (e) {
                statusText.innerText = "Ready - Click play on audio bar";
            }
        }

        document.getElementById('audioPlayer').addEventListener('error', async (e) => {
            if (!currentTrack) return;
            
            const statusText = document.getElementById('statusText');
            statusText.innerText = `${currentTrack.provider} stream failed. Rescuing playback...`;
            
            try {
                const fallbackTrack = await apiPool.getFallbackTrack(currentTrack);
                console.log("Rescued track:", fallbackTrack);
                playTrack(fallbackTrack); // Re-initiate playback with the new track data
            } catch (err) {
                statusText.innerText = "Stream failed on all providers.";
                console.error("Playback rescue failed:", err);
            }
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
