<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Study.com | K-12 Online Learning and Worksheet Portal" />
    <meta property="og:site_name" content="Study.com Learning" />
    <meta name="msapplication-TileColor" content="#00ffa6" />
    <meta property="og:image" content="https://www.ixl.com/dv3/powZqMuTE7du4asFrVyNGxxoqkw/yui3/opengraph/assets/general_us.png" />
    <meta name="description" content="Study.com is a trusted educational resource for K–12 students. Providing interactive worksheets, practice questions, and study guides." />
    <meta property="og:description" content="Study.com is a trusted educational resource for K–12 students. Providing interactive worksheets, practice questions, and study guides." />
    <title>Learning Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1216;
            --text: #ffb8d9;
            --card: rgba(255, 255, 255, 0.06);
            --nav: rgba(26, 18, 22, 0.85);
        }

        * {
            font-family: "Quicksand", sans-serif !important;
            box-sizing: border-box;
        }

        body {
            font-family: "Quicksand", sans-serif !important;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-weight: bold;
        }

        #sidebar {
            width: 280px;
            background-color: var(--nav);
            border-right: 1px solid rgba(128, 128, 128, 0.2);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: -280px;
            transition: left 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        #sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 900 !important;
        }

        #new-chat-btn {
            background-color: var(--card);
            color: var(--text);
            border: 1px solid rgba(128, 128, 128, 0.3);
            padding: 10px 12px;
            border-radius: 12px;
            font-weight: 900 !important;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            transition: opacity 0.2s, border-color 0.2s;
        }

        #new-chat-btn:hover {
            border-color: var(--text);
            opacity: 0.9;
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text);
            background-color: transparent;
            transition: background 0.2s;
        }

        .chat-item:hover {
            background-color: var(--card);
        }

        .chat-item.active {
            background-color: var(--card);
            border-left: 4px solid var(--text);
        }

        .chat-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 8px;
        }

        .chat-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-item:hover .chat-actions {
            opacity: 1;
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(128, 128, 128, 0.3);
            color: var(--text);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .action-btn:hover {
            background-color: var(--card);
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background-color: transparent;
        }

        header {
            background-color: var(--nav);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #menu-toggle {
            background: var(--card);
            border: 1px solid rgba(128, 128, 128, 0.3);
            color: var(--text);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background 0.2s, border-color 0.2s;
        }

        #menu-toggle:hover {
            border-color: var(--text);
        }

        #model-picker-btn {
            background-color: var(--card);
            color: var(--text);
            border: 1px solid rgba(128, 128, 128, 0.3);
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 900 !important;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.2s;
        }

        #model-picker-btn:hover {
            border-color: var(--text);
        }

        #status-text {
            display: none;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: transparent;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .user-message {
            background-color: var(--card);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(128, 128, 128, 0.3);
        }

        .ai-message {
            background-color: var(--card);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(128, 128, 128, 0.3);
        }

        .error-message {
            background-color: rgba(255, 0, 0, 0.15);
            color: #ff8b8b;
            border: 1px solid rgba(255, 0, 0, 0.3);
            font-family: monospace !important;
            font-size: 0.85rem;
        }

        .message-img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
        }

        #attachment-preview {
            display: none;
            padding: 8px 15px 0 15px;
            background-color: transparent;
            gap: 8px;
            align-items: center;
        }

        .preview-chip {
            background-color: var(--card);
            border: 1px solid rgba(128, 128, 128, 0.3);
            padding: 6px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .preview-chip img {
            width: 24px;
            height: 24px;
            object-fit: cover;
            border-radius: 4px;
        }

        .remove-attachment {
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-weight: 900 !important;
            opacity: 0.7;
        }

        .remove-attachment:hover {
            opacity: 1;
            color: #ff8b8b;
        }

        #input-container {
            background-color: var(--nav);
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(128, 128, 128, 0.2);
            align-items: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        #attach-btn {
            background: var(--card);
            border: 1px solid rgba(128, 128, 128, 0.3);
            color: var(--text);
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s, border-color 0.2s;
        }

        #attach-btn:hover:not(:disabled) {
            border-color: var(--text);
        }

        #attach-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        textarea {
            flex: 1;
            background-color: var(--card);
            color: var(--text);
            border: 1px solid rgba(128, 128, 128, 0.3);
            border-radius: 20px;
            padding: 12px 20px;
            resize: none;
            height: 44px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: var(--text); }

        button#send-btn {
            background-color: var(--text);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 900 !important;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button#send-btn:hover:not(:disabled) {
            opacity: 0.9;
        }

        button#send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            z-index: 999;
        }
        #overlay.active { display: block; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background-color: var(--nav);
            border: 1px solid rgba(128, 128, 128, 0.3);
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .modal-box h3 { margin: 0; font-size: 1.1rem; font-weight: 900 !important; }
        .modal-box p { margin: 0; font-size: 0.95rem; opacity: 0.8; line-height: 1.4; }
        .modal-box input {
            background-color: var(--card);
            border: 1px solid rgba(128, 128, 128, 0.3);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.95rem;
            font-weight: bold;
            outline: none;
        }
        .modal-box input:focus { border-color: var(--text); }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 6px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(128, 128, 128, 0.3);
            background-color: var(--card);
            color: var(--text);
            font-weight: 900 !important;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .modal-btn:hover { border-color: var(--text); opacity: 0.9; }
        .modal-btn.primary { background-color: var(--text); color: var(--bg); border-color: var(--text); }
        .modal-btn.secondary { background-color: transparent; }
        .modal-btn.danger { background-color: rgba(255, 100, 100, 0.2); color: #ff8b8b; border-color: rgba(255, 100, 100, 0.3); }

        #model-modal-box {
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .model-list-container {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 50vh;
            padding-right: 4px;
        }

        .model-category-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            margin: 6px 0 2px 0;
            font-weight: 900 !important;
        }

        .model-option-card {
            background-color: var(--card);
            border: 1px solid rgba(128, 128, 128, 0.3);
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .model-option-card:hover {
            border-color: var(--text);
            background-color: var(--card);
        }

        .model-option-card.selected {
            border-color: var(--text);
            background-color: var(--card);
        }

        .model-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-card-name {
            font-weight: 900 !important;
            font-size: 0.95rem;
            color: var(--text);
        }

        .model-card-tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 8px;
            background-color: var(--card);
            border: 1px solid rgba(128, 128, 128, 0.3);
            color: var(--text);
            font-weight: 900 !important;
        }

        .model-card-desc {
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Chat History</h3>
        </div>
        <div style="padding: 10px;">
            <button id="new-chat-btn">+ New Chat</button>
        </div>
        <div id="chat-list"></div>
    </div>
    <div id="overlay"></div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">Title</h3>
            <p id="modal-message" style="display: none;"></p>
            <input type="text" id="modal-input" style="display: none;" />
            <div class="modal-buttons">
                <button id="modal-cancel-btn" class="modal-btn secondary">Cancel</button>
                <button id="modal-confirm-btn" class="modal-btn primary">Confirm</button>
            </div>
        </div>
    </div>

    <div id="model-modal-overlay" class="modal-overlay">
        <div class="modal-box" id="model-modal-box">
            <h3>Select AI Model</h3>
            <p style="margin: 0;">Choose a model to load locally into your browser:</p>
            <div class="model-list-container" id="model-list-container"></div>
            <div class="modal-buttons" style="justify-content: space-between; align-items: center; border-top: 1px solid rgba(128,128,128,0.2); padding-top: 12px; margin-top: 4px;">
                <button id="clear-cache-btn" class="modal-btn danger">Clear Model Cache</button>
                <button id="model-modal-close" class="modal-btn secondary">Close</button>
            </div>
        </div>
    </div>

    <div id="main-content">
        <header>
            <div class="header-left">
                <button id="menu-toggle" title="Open menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>

                </button>
                <button id="model-picker-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span id="current-model-label">Select Model</span>
                </button>
            </div>
            <span id="status-text">Initializing engine...</span>
        </header>

        <div id="chat-container">
            <!-- Messages render here -->
        </div>

        <div id="attachment-preview"></div>

        <div id="input-container">
            <input type="file" id="file-input" style="display: none;" accept="image/*,.txt,.md,.json,.js,.html,.css">
            <button id="attach-btn" title="Attach file or image" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>

            <button id="send-btn" disabled>
                <div class="spinner"></div>
                <span>Loading</span>
            </button>
        </div>
    </div>

    <script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";
const GREETING_TEXT = "Hello, how may I assist you?";
let engine, isModelReady = false, attachedFile = null;
let chats = JSON.parse(localStorage.getItem('ai_chats')) || [];
let currentChatId = localStorage.getItem('ai_current_chat_id') || null;
let selectedModel = localStorage.getItem('ai_selected_model') || "Llama-3.2-1B-Instruct-q4f16_1-MLC";

const AVAILABLE_MODELS = [
    { id: "Llama-3.2-1B-Instruct-q4f16_1-MLC", name: "Llama 3.2 (1B)", tag: "Bite-Sized", category: "Bite-Sized & Mobile-Friendly", desc: "Ultra-compact model, lightning fast on phones." },

    { id: "Gemma-2-2b-it-q4f16_1-MLC", name: "Gemma 2 (2B)", tag: "Mobile-Friendly", category: "Bite-Sized & Mobile-Friendly", desc: "Google's efficient small architecture." },
    { id: "Phi-3.5-mini-instruct-q4f16_1-MLC", name: "Phi-3.5 Mini (3.8B)", tag: "Mobile-Friendly", category: "Bite-Sized & Mobile-Friendly", desc: "High reasoning capacity in a small footprint." },

    { id: "Mistral-7B-Instruct-v0.3-q4f16_1-MLC", name: "Mistral v0.3 (7B)", tag: "Desktop", category: "Standard Desktop Models", desc: "Reliable general-purpose assistant." },
    { id: "Gemma-2-9b-it-q4f16_1-MLC", name: "Gemma 2 (9B)", tag: "Desktop Heavy", category: "Standard Desktop Models", desc: "Advanced capabilities for powerful devices." },

];

const ICON_EDIT = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>`;
const ICON_DELETE = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;

const el = (id) => document.getElementById(id);
const DOM = {
    sendBtn: el('send-btn'), userInput: el('user-input'), chatContainer: el('chat-container'),
    statusText: el('status-text'), chatList: el('chat-list'), newChatBtn: el('new-chat-btn'),
    menuToggle: el('menu-toggle'), sidebar: el('sidebar'), overlay: el('overlay'),
    attachBtn: el('attach-btn'), fileInput: el('file-input'), attachmentPreview: el('attachment-preview'),
    modelPickerBtn: el('model-picker-btn'), currentModelLabel: el('current-model-label'),
    modelModalOverlay: el('model-modal-overlay'), modelModalClose: el('model-modal-close'),
    modelListContainer: el('model-list-container'), clearCacheBtn: el('clear-cache-btn')
};

const formatMarkdown = (text) => text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') 
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/```([\s\S]*?)```/g, '<pre style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; overflow-x: auto;"><code>$1</code></pre>')
    .replace(/`(.*?)`/g, '<code style="background: rgba(0,0,0,0.2); padding: 2px 4px; border-radius: 4px;">$1</code>')
    .replace(/\n/g, '<br>');

const scrollToBottom = () => DOM.chatContainer.scrollTop = DOM.chatContainer.scrollHeight;

function saveChats() {
    localStorage.setItem('ai_chats', JSON.stringify(chats));
    currentChatId ? localStorage.setItem('ai_current_chat_id', currentChatId) : localStorage.removeItem('ai_current_chat_id');
}

let isUpdatingDOM = false;
let pendingHTML = "";
function throttledUpdateBubble(bubbleEl, rawText) {
    pendingHTML = formatMarkdown(rawText);
    if (!isUpdatingDOM) {
        isUpdatingDOM = true;
        requestAnimationFrame(() => {
            bubbleEl.innerHTML = `<div>${pendingHTML}</div>`;
            scrollToBottom();
            isUpdatingDOM = false;
        });
    }
}

function addMessageToUI(role, text, imageUrl = null, isError = false) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${role === 'user' ? 'user-message' : 'ai-message'} ${isError ? 'error-message' : ''}`;
    let html = imageUrl ? `<img src="${imageUrl}" class="message-img" />` : '';
    html += `<div>${formatMarkdown(text)}</div>`;
    msgDiv.innerHTML = html;
    DOM.chatContainer.appendChild(msgDiv);
    scrollToBottom();
    return msgDiv; 
}

function renderChatList() {
    DOM.chatList.innerHTML = '';
    chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        item.innerHTML = `
            <span class="chat-title">${chat.title}</span>
            <div class="chat-actions">
                <button class="action-btn edit-btn" title="Rename">${ICON_EDIT}</button>
                <button class="action-btn delete-btn" title="Delete">${ICON_DELETE}</button>
            </div>
        `;
        
        item.querySelector('.edit-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            showModal({
                title: 'Rename Chat', showInput: true, defaultValue: chat.title, confirmText: 'Save',
                onConfirm: (newTitle) => {
                    if (newTitle?.trim()) { chat.title = newTitle.trim(); saveChats(); renderChatList(); }
                }
            });
        });

        item.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            showModal({
                title: 'Delete Chat', message: 'Are you sure you want to delete this chat?', confirmText: 'Delete', isDanger: true,
                onConfirm: () => {
                    chats = chats.filter(c => c.id !== chat.id);
                    if (currentChatId === chat.id) {
                        currentChatId = chats.length ? chats[0].id : null;
                        currentChatId ? loadChat(currentChatId) : createNewChat();
                    }
                    saveChats(); renderChatList();
                }
            });
        });

        item.addEventListener('click', () => {
            if (window.innerWidth <= 768) toggleSidebar();
            loadChat(chat.id);
        });
        DOM.chatList.appendChild(item);
    });
}

function createNewChat() {
    currentChatId = Date.now().toString();
    chats.unshift({ id: currentChatId, title: 'New Chat', messages: [] });
    saveChats(); renderChatList(); loadChat(currentChatId);
}

function loadChat(id) {
    currentChatId = id; saveChats(); renderChatList(); DOM.chatContainer.innerHTML = '';
    const chat = chats.find(c => c.id === id);
    if (!chat || chat.messages.length === 0) return addMessageToUI('ai', GREETING_TEXT);

    chat.messages.forEach(msg => {
        let contentText = "", imgUrl = null;
        if (typeof msg.content === 'string') contentText = msg.content;
        else if (Array.isArray(msg.content)) {
            contentText = msg.content.find(p => p.type === 'text')?.text || "";
            imgUrl = msg.content.find(p => p.type === 'image_url')?.image_url.url || null;
        }
        addMessageToUI(msg.role, contentText, imgUrl);
    });
}

async function sendMessage() {
    const text = DOM.userInput.value.trim();
    if ((!text && !attachedFile) || !isModelReady) return;

    if (!chats.find(c => c.id === currentChatId)) createNewChat();
    const chat = chats.find(c => c.id === currentChatId);
    
    let messageContent = text, uiImageUrl = null;
    if (attachedFile) {
        if (attachedFile.type === 'image') {
            messageContent = [{ type: "text", text: text || "Describe this image." }, { type: "image_url", image_url: { url: attachedFile.dataUrl } }];
            uiImageUrl = attachedFile.dataUrl;
        } else if (attachedFile.type === 'text') {
            messageContent = `Attached File (${attachedFile.name}):\n\`\`\`\n${attachedFile.content}\n\`\`\`\n\nUser Input: ${text}`;
        }
    }

    addMessageToUI('user', text, uiImageUrl);
    chat.messages.push({ role: 'user', content: messageContent });
    
    if (chat.title === 'New Chat' && text) {
        chat.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
        renderChatList();
    }
    saveChats();

    DOM.userInput.value = ''; DOM.userInput.style.height = '24px';
    clearAttachment();
    DOM.userInput.disabled = DOM.sendBtn.disabled = DOM.attachBtn.disabled = true;
    DOM.sendBtn.innerHTML = `<div class="spinner"></div><span>Thinking</span>`;

    try {
        const messagesForEngine = [{ role: "system", content: "You are a helpful AI assistant." }, ...chat.messages];
        const asyncChunkGenerator = await engine.chat.completions.create({ messages: messagesForEngine, stream: true, temperature: 0.7 });
        
        const aiMsgBubble = addMessageToUI('ai', '');
        let aiFullResponse = "";

        for await (const chunk of asyncChunkGenerator) {
            aiFullResponse += chunk.choices[0]?.delta?.content || "";
            throttledUpdateBubble(aiMsgBubble, aiFullResponse);
        }
        
        aiMsgBubble.innerHTML = `<div>${formatMarkdown(aiFullResponse)}</div>`;
        scrollToBottom();

        chat.messages.push({ role: 'assistant', content: aiFullResponse });
        saveChats();
    } catch (error) {
        console.error("Inference Error:", error);
        addMessageToUI('ai', `**Inference Error:**<br>${error.message || String(error)}<br><br>*Tip: If this says 'Out of Memory', try switching to a smaller model in the top menu or starting a new chat.*`, null, true);
        chat.messages.pop(); saveChats();
    } finally {
        DOM.userInput.disabled = DOM.sendBtn.disabled = false;
        DOM.sendBtn.innerHTML = "<span>Send</span>";
        updateAttachmentSupport(selectedModel);
        DOM.userInput.focus();
    }
}

function showModal({ title, message, showInput, defaultValue, confirmText, isDanger, showCancel = true, onConfirm }) {
    const modalOverlay = el('modal-overlay'), titleEl = el('modal-title'), msgEl = el('modal-message'), inputEl = el('modal-input');
    const confirmBtn = el('modal-confirm-btn'), cancelBtn = el('modal-cancel-btn');

    titleEl.innerText = title;
    msgEl.style.display = message ? 'block' : 'none';
    if (message) msgEl.innerText = message;

    if (showInput) { inputEl.value = defaultValue || ''; inputEl.style.display = 'block'; setTimeout(() => inputEl.focus(), 100); } 
    else inputEl.style.display = 'none';

    cancelBtn.style.display = showCancel ? 'block' : 'none';
    confirmBtn.innerText = confirmText || 'Confirm';
    confirmBtn.className = `modal-btn ${isDanger ? 'danger' : 'primary'}`;
    modalOverlay.classList.add('active');

    const closeModal = () => { modalOverlay.classList.remove('active'); confirmBtn.onclick = cancelBtn.onclick = null; };
    cancelBtn.onclick = closeModal;
    confirmBtn.onclick = () => { const val = showInput ? inputEl.value : null; closeModal(); if (onConfirm) onConfirm(val); };
    if (showInput) inputEl.onkeydown = (e) => { if (e.key === 'Enter') confirmBtn.click(); };
}

function openModelModal() {
    DOM.modelListContainer.innerHTML = '';
    const categories = [...new Set(AVAILABLE_MODELS.map(m => m.category))];
    categories.forEach(cat => {
        const catTitle = document.createElement('div');
        catTitle.className = 'model-category-title';
        catTitle.innerText = cat;
        DOM.modelListContainer.appendChild(catTitle);

        AVAILABLE_MODELS.filter(m => m.category === cat).forEach(model => {
            const card = document.createElement('div');
            card.className = `model-option-card ${model.id === selectedModel ? 'selected' : ''}`;
            card.innerHTML = `<div class="model-card-header"><span class="model-card-name">${model.name}</span><span class="model-card-tag">${model.tag}</span></div><span class="model-card-desc">${model.desc}</span>`;
            card.addEventListener('click', () => {
                DOM.modelModalOverlay.classList.remove('active');
                if (model.id !== selectedModel) {
                    showModal({
                        title: 'Download & Load Model', message: `Switch model to "${model.name}"? This will download/load the model locally.`, confirmText: 'Download & Load',
                        onConfirm: () => initModel(model.id)
                    });
                }
            });
            DOM.modelListContainer.appendChild(card);
        });
    });
    DOM.modelModalOverlay.classList.add('active');
}

DOM.clearCacheBtn.addEventListener('click', () => {
    DOM.modelModalOverlay.classList.remove('active');
    showModal({
        title: 'Clear AI Model Cache', message: 'This will purge all downloaded WebLLM AI model weights. Chat history remains.', confirmText: 'Clear Cache', isDanger: true,
        onConfirm: async () => {
            DOM.statusText.innerText = "Clearing cache...";
            try {
                if (webllm.clearModelCache) await webllm.clearModelCache();
                else {
                    const cacheNames = await caches.keys();
                    for (const name of cacheNames) if (name.includes('webllm') || name.includes('mlc') || name.includes('wasm')) await caches.delete(name);
                }
                showModal({ title: 'Cache Cleared', message: 'Model cache purged. Page will reload.', confirmText: 'OK', showCancel: false, onConfirm: () => window.location.reload() });
            } catch (err) { showModal({ title: 'Error', message: 'Failed to clear cache: ' + err.message, confirmText: 'OK', showCancel: false }); }
        }
    });
});

function updateAttachmentSupport(modelId) {
    DOM.attachBtn.disabled = !(modelId.toLowerCase().includes('vision') && isModelReady);
    if (DOM.attachBtn.disabled) clearAttachment();
}

function clearAttachment() {
    attachedFile = null; DOM.fileInput.value = ''; DOM.attachmentPreview.style.display = 'none'; DOM.attachmentPreview.innerHTML = '';
}

DOM.fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        attachedFile = file.type.startsWith('image/') ? { type: 'image', name: file.name, dataUrl: ev.target.result } : { type: 'text', name: file.name, content: ev.target.result };
        DOM.attachmentPreview.style.display = 'flex';
        DOM.attachmentPreview.innerHTML = `<div class="preview-chip">${attachedFile.type === 'image' ? `<img src="${attachedFile.dataUrl}" />` : `<span>📄</span>`}<span style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${attachedFile.name}</span><button class="remove-attachment" id="remove-file-btn">×</button></div>`;
        el('remove-file-btn').addEventListener('click', clearAttachment);
    };
    file.type.startsWith('image/') ? reader.readAsDataURL(file) : reader.readAsText(file);
});

const toggleSidebar = () => { DOM.sidebar.classList.toggle('open'); DOM.overlay.classList.toggle('active'); };

DOM.modelPickerBtn.addEventListener('click', openModelModal);
DOM.modelModalClose.addEventListener('click', () => DOM.modelModalOverlay.classList.remove('active'));
DOM.modelModalOverlay.addEventListener('click', (e) => { if (e.target === DOM.modelModalOverlay) DOM.modelModalOverlay.classList.remove('active'); });
DOM.attachBtn.addEventListener('click', () => { if (!DOM.attachBtn.disabled) DOM.fileInput.click(); });
DOM.menuToggle.addEventListener('click', toggleSidebar);
DOM.overlay.addEventListener('click', toggleSidebar);
DOM.newChatBtn.addEventListener('click', () => { if (window.innerWidth <= 768) toggleSidebar(); createNewChat(); });

DOM.sendBtn.addEventListener('click', sendMessage);
DOM.userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
DOM.userInput.addEventListener('input', function() { this.style.height = '24px'; this.style.height = this.scrollHeight + 'px'; });

async function initModel(modelId) {
    isModelReady = false; DOM.userInput.disabled = DOM.sendBtn.disabled = DOM.attachBtn.disabled = true;
    DOM.sendBtn.innerHTML = `<div class="spinner"></div><span>Loading</span>`;
    
    selectedModel = modelId; localStorage.setItem('ai_selected_model', selectedModel);
    DOM.currentModelLabel.innerText = AVAILABLE_MODELS.find(m => m.id === modelId)?.name || "Select Model";

    try {
        engine = await webllm.CreateMLCEngine(modelId, { initProgressCallback: (report) => DOM.statusText.innerText = report.text });
        DOM.statusText.innerText = "Ready (Local)";
        isModelReady = true; DOM.userInput.disabled = DOM.sendBtn.disabled = false;
        DOM.sendBtn.innerHTML = "<span>Send</span>";
        updateAttachmentSupport(selectedModel);
    } catch (error) {
        DOM.statusText.innerText = "Error loading model."; console.error(error); DOM.sendBtn.innerHTML = "<span>Failed</span>";
    }
}

window.addEventListener('DOMContentLoaded', async () => {
    renderChatList();
    if (chats.length > 0) {
        if (!currentChatId || !chats.find(c => c.id === currentChatId)) currentChatId = chats[0].id;
        loadChat(currentChatId);
    } else addMessageToUI('ai', GREETING_TEXT);

    await initModel(selectedModel);
});
    </script>
</body>
