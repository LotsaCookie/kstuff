<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-color: rgba(0, 0, 0, 0.15);
            --chat-bg: rgba(0, 0, 0, 0.15);
            --sidebar-bg: rgba(0, 0, 0, 0.15);
            --text-color: #e3e3e3;
            --user-bubble: rgba(0, 0, 0, 0.15);
            --ai-bubble: rgba(0, 0, 0, 0.15);
            --accent-color: #a8c7fa;
            --input-bg: rgba(0, 0, 0, 0.15);
            --hover-color: rgba(0, 0, 0, 0.15);
            --danger-color: rgba(0, 0, 0, 0.15);
            --danger-text: #e3e3e3;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: rgba(0, 0, 0, 0.15);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 280px;
            background-color: rgba(0, 0, 0, 0.15);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: -280px;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        #sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
        }

        #new-chat-btn {
            background-color: rgba(0, 0, 0, 0.15);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 12px;
            border-radius: 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            transition: opacity 0.2s;
        }

        #new-chat-btn:hover {
            opacity: 0.9;
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-color);
            background-color: rgba(0, 0, 0, 0.15);
            transition: background 0.2s;
        }

        .chat-item:hover {
            background-color: rgba(0, 0, 0, 0.15);
        }

        .chat-item.active {
            background-color: rgba(0, 0, 0, 0.15);
            border-left: 4px solid var(--accent-color);
        }

        .chat-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 8px;
        }

        .chat-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-item:hover .chat-actions {
            opacity: 1;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9aa0a6;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .action-btn:hover {
            color: var(--text-color);
            background-color: rgba(0, 0, 0, 0.15);
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.15);
        }

        header {
            background-color: rgba(0, 0, 0, 0.15);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 40px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #menu-toggle {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        #menu-toggle:hover {
            background-color: rgba(0, 0, 0, 0.15);
        }

        #model-picker-btn {
            background-color: rgba(0, 0, 0, 0.15);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 6px 14px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.2s;
        }

        #model-picker-btn:hover {
            border-color: var(--accent-color);
        }

        #status-text {
            display: none;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: rgba(0, 0, 0, 0.15);
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
            background-color: rgba(0, 0, 0, 0.15);
        }

        .user-message {
            background-color: rgba(0, 0, 0, 0.15);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ai-message {
            background-color: rgba(0, 0, 0, 0.15);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .message-img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
        }

        #attachment-preview {
            display: none;
            padding: 8px 15px 0 15px;
            background-color: rgba(0, 0, 0, 0.15);
            gap: 8px;
            align-items: center;
        }

        .preview-chip {
            background-color: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .preview-chip img {
            width: 24px;
            height: 24px;
            object-fit: cover;
            border-radius: 4px;
        }

        .remove-attachment {
            background: rgba(0, 0, 0, 0.15);
            border: none;
            color: #9aa0a6;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-attachment:hover {
            color: var(--danger-color);
        }

        #input-container {
            background-color: rgba(0, 0, 0, 0.15);
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            align-items: center;
        }

        #attach-btn {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }

        #attach-btn:hover:not(:disabled) {
            background-color: rgba(0, 0, 0, 0.15);
            color: var(--accent-color);
        }

        #attach-btn:disabled {
            color: #555558;
            cursor: not-allowed;
        }

        textarea {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.15);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 12px 20px;
            resize: none;
            height: 24px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        textarea:focus { border-color: var(--accent-color); }

        button#send-btn {
            background-color: rgba(0, 0, 0, 0.15);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button#send-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            z-index: 999;
        }
        #overlay.active { display: block; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background-color: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 24px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-box h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        .modal-box p { margin: 0; font-size: 0.95rem; color: #9aa0a6; line-height: 1.4; }
        .modal-box input {
            background-color: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.95rem;
            outline: none;
        }
        .modal-box input:focus { border-color: var(--accent-color); }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 6px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(0, 0, 0, 0.15);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-btn:hover { opacity: 0.85; }
        .modal-btn.primary { background-color: rgba(0, 0, 0, 0.15); }
        .modal-btn.secondary { background-color: rgba(0, 0, 0, 0.15); }
        .modal-btn.danger { background-color: rgba(0, 0, 0, 0.15); }

        #model-modal-box {
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            background-color: rgba(0, 0, 0, 0.15);
        }

        .model-list-container {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 55vh;
            padding-right: 4px;
        }

        .model-category-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-color);
            margin: 6px 0 2px 0;
            font-weight: bold;
        }

        .model-option-card {
            background-color: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .model-option-card:hover {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.15);
        }

        .model-option-card.selected {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.15);
        }

        .model-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-card-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        .model-card-tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-color);
            font-weight: 500;
        }

        .model-card-desc {
            font-size: 0.8rem;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Chat History</h3>
        </div>
        <div style="padding: 10px;">
            <button id="new-chat-btn">+ New Chat</button>
        </div>
        <div id="chat-list"></div>
    </div>
    <div id="overlay"></div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">Title</h3>
            <p id="modal-message" style="display: none;"></p>
            <input type="text" id="modal-input" style="display: none;" />
            <div class="modal-buttons">
                <button id="modal-cancel-btn" class="modal-btn secondary">Cancel</button>
                <button id="modal-confirm-btn" class="modal-btn primary">Confirm</button>
            </div>
        </div>
    </div>

    <div id="model-modal-overlay" class="modal-overlay">
        <div class="modal-box" id="model-modal-box">
            <h3>Select AI Model</h3>
            <p style="margin: 0;">Choose a model to load locally into your browser:</p>
            <div class="model-list-container" id="model-list-container"></div>
            <div class="modal-buttons">
                <button id="model-modal-close" class="modal-btn secondary">Close</button>
            </div>
        </div>
    </div>

    <div id="main-content">
        <header>
            <div class="header-left">
                <button id="menu-toggle" title="Open menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <button id="model-picker-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span id="current-model-label">Select Model</span>
                </button>
            </div>
            <span id="status-text">Initializing engine...</span>
        </header>

        <div id="chat-container">
            <div class="message ai-message">Hello, how may I assist you?</div>
        </div>

        <div id="attachment-preview"></div>

        <div id="input-container">
            <input type="file" id="file-input" style="display: none;" accept="image/*,.txt,.md,.json,.js,.html,.css">
            <button id="attach-btn" title="Attach file or image" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </button>
            <textarea id="user-input" placeholder="Type a message..." disabled></textarea>
            <button id="send-btn" disabled>
                <div class="spinner"></div>
                <span>Loading</span>
            </button>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        const GREETING_TEXT = "Hello, how may I assist you?";
        
        let engine;
        let chats = JSON.parse(localStorage.getItem('ai_chats')) || [];
        let currentChatId = localStorage.getItem('ai_current_chat_id') || null;
        let selectedModel = localStorage.getItem('ai_selected_model') || "Llama-3.2-1B-Instruct-q4f16_1-MLC";
        let attachedFile = null;

        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const statusText = document.getElementById('status-text');
        const chatListEl = document.getElementById('chat-list');
        const newChatBtn = document.getElementById('new-chat-btn');
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const attachmentPreview = document.getElementById('attachment-preview');
        const modelPickerBtn = document.getElementById('model-picker-btn');
        const currentModelLabel = document.getElementById('current-model-label');
        const modelModalOverlay = document.getElementById('model-modal-overlay');
        const modelModalClose = document.getElementById('model-modal-close');
        const modelListContainer = document.getElementById('model-list-container');

        let isModelReady = false;

        const AVAILABLE_MODELS = [
            { id: "Llama-3.2-1B-Instruct-q4f16_1-MLC", name: "Llama 3.2 (1B)", tag: "Bite-Sized", category: "Bite-Sized & Mobile-Friendly", desc: "Ultra-compact model, lightning fast on phones." },
            { id: "Llama-3.2-3B-Instruct-q4f16_1-MLC", name: "Llama 3.2 (3B)", tag: "Bite-Sized", category: "Bite-Sized & Mobile-Friendly", desc: "Great balance of speed and reasoning." },
            { id: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC", name: "Qwen 2.5 (1.5B)", tag: "Bite-Sized", category: "Bite-Sized & Mobile-Friendly", desc: "Strong multilingual and coding performance." },
            { id: "SmolLM2-1.7B-Instruct-q4f16_1-MLC", name: "SmolLM2 (1.7B)", tag: "Bite-Sized", category: "Bite-Sized & Mobile-Friendly", desc: "Compact model optimized for everyday tasks." },
            { id: "Gemma-2-2b-it-q4f16_1-MLC", name: "Gemma 2 (2B)", tag: "Mobile-Friendly", category: "Bite-Sized & Mobile-Friendly", desc: "Google's efficient small architecture." },
            { id: "Phi-3.5-mini-instruct-q4f16_1-MLC", name: "Phi-3.5 Mini (3.8B)", tag: "Mobile-Friendly", category: "Bite-Sized & Mobile-Friendly", desc: "High reasoning capacity in a small footprint." },
            { id: "Llama-3-8B-Instruct-q4f16_1-MLC", name: "Llama 3 (8B)", tag: "Desktop", category: "Standard Desktop Models", desc: "Full-sized model requiring more RAM/VRAM." },
            { id: "Mistral-7B-Instruct-v0.3-q4f16_1-MLC", name: "Mistral v0.3 (7B)", tag: "Desktop", category: "Standard Desktop Models", desc: "Reliable general-purpose assistant." },
            { id: "Gemma-2-9b-it-q4f16_1-MLC", name: "Gemma 2 (9B)", tag: "Desktop Heavy", category: "Standard Desktop Models", desc: "Advanced capabilities for powerful devices." },
            { id: "Llama-3.2-11B-Vision-Instruct-q4f16_1-MLC", name: "Llama 3.2 Vision (11B)", tag: "Multimodal", category: "Multimodal Vision Models", desc: "Supports images, documents, and visual reasoning." }
        ];

        const ICON_EDIT = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>`;
        const ICON_DELETE = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;

        function renderModelModalOptions() {
            modelListContainer.innerHTML = '';
            
            const categories = [...new Set(AVAILABLE_MODELS.map(m => m.category))];
            categories.forEach(cat => {
                const catTitle = document.createElement('div');
                catTitle.className = 'model-category-title';
                catTitle.innerText = cat;
                modelListContainer.appendChild(catTitle);

                const modelsInCat = AVAILABLE_MODELS.filter(m => m.category === cat);
                modelsInCat.forEach(model => {
                    const card = document.createElement('div');
                    card.className = `model-option-card ${model.id === selectedModel ? 'selected' : ''}`;
                    card.innerHTML = `
                        <div class="model-card-header">
                            <span class="model-card-name">${model.name}</span>
                            <span class="model-card-tag">${model.tag}</span>
                        </div>
                        <span class="model-card-desc">${model.desc}</span>
                    `;

                    card.addEventListener('click', () => {
                        closeModelModal();
                        if (model.id !== selectedModel) {
                            showModal({
                                title: 'Download & Load Model',
                                message: `Switch model to "${model.name}"? This will download/load the model locally into your browser.`,
                                confirmText: 'Download & Load',
                                onConfirm: () => {
                                    initModel(model.id);
                                }
                            });
                        }
                    });

                    modelListContainer.appendChild(card);
                });
            });
        }

        function openModelModal() {
            renderModelModalOptions();
            modelModalOverlay.classList.add('active');
        }

        function closeModelModal() {
            modelModalOverlay.classList.remove('active');
        }

        modelPickerBtn.addEventListener('click', openModelModal);
        modelModalClose.addEventListener('click', closeModelModal);
        modelModalOverlay.addEventListener('click', (e) => {
            if (e.target === modelModalOverlay) closeModelModal();
        });

        function updateHeaderModelLabel(modelId) {
            const found = AVAILABLE_MODELS.find(m => m.id === modelId);
            currentModelLabel.innerText = found ? found.name : "Select Model";
        }

        function updateAttachmentSupport(modelId) {
            const isVisionModel = modelId.toLowerCase().includes('vision');
            if (isVisionModel && isModelReady) {
                attachBtn.disabled = false;
            } else {
                attachBtn.disabled = true;
                clearAttachment();
            }
        }

        attachBtn.addEventListener('click', () => {
            if (!attachBtn.disabled) fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            if (file.type.startsWith('image/')) {
                reader.onload = function(uploadEvent) {
                    attachedFile = {
                        type: 'image',
                        name: file.name,
                        dataUrl: uploadEvent.target.result
                    };
                    renderAttachmentPreview();
                };
                reader.readAsDataURL(file);
            } else {
                reader.onload = function(uploadEvent) {
                    attachedFile = {
                        type: 'text',
                        name: file.name,
                        content: uploadEvent.target.result
                    };
                    renderAttachmentPreview();
                };
                reader.readAsText(file);
            }
        });

        function renderAttachmentPreview() {
            if (!attachedFile) {
                attachmentPreview.style.display = 'none';
                attachmentPreview.innerHTML = '';
                return;
            }

            attachmentPreview.style.display = 'flex';
            attachmentPreview.innerHTML = `
                <div class="preview-chip">
                    ${attachedFile.type === 'image' ? `<img src="${attachedFile.dataUrl}" />` : `<span>📄</span>`}
                    <span style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${attachedFile.name}</span>
                    <button class="remove-attachment" id="remove-file-btn">×</button>
                </div>
            `;
            document.getElementById('remove-file-btn').addEventListener('click', clearAttachment);
        }

        function clearAttachment() {
            attachedFile = null;
            fileInput.value = '';
            attachmentPreview.style.display = 'none';
            attachmentPreview.innerHTML = '';
        }

        function showModal({ title, message, showInput, defaultValue, confirmText, isDanger, showCancel = true, onConfirm }) {
            const modalOverlay = document.getElementById('modal-overlay');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');
            const inputEl = document.getElementById('modal-input');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            titleEl.innerText = title;
            if (message) { msgEl.innerText = message; msgEl.style.display = 'block'; }
            else { msgEl.style.display = 'none'; }

            if (showInput) {
                inputEl.value = defaultValue || '';
                inputEl.style.display = 'block';
                setTimeout(() => inputEl.focus(), 100);
            } else {
                inputEl.style.display = 'none';
            }

            cancelBtn.style.display = showCancel ? 'block' : 'none';
            confirmBtn.innerText = confirmText || 'Confirm';
            confirmBtn.className = `modal-btn ${isDanger ? 'danger' : 'primary'}`;
            modalOverlay.classList.add('active');

            const closeModal = () => {
                modalOverlay.classList.remove('active');
                confirmBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            cancelBtn.onclick = closeModal;
            confirmBtn.onclick = () => {
                const val = showInput ? inputEl.value : null;
                closeModal();
                if (onConfirm) onConfirm(val);
            };
            if (showInput) {
                inputEl.onkeydown = (e) => { if (e.key === 'Enter') confirmBtn.click(); };
            }
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        async function initModel(modelId) {
            isModelReady = false;
            userInput.disabled = true;
            sendBtn.disabled = true;
            attachBtn.disabled = true;
            sendBtn.innerHTML = `<div class="spinner"></div><span>Loading</span>`;

            selectedModel = modelId;
            localStorage.setItem('ai_selected_model', selectedModel);
            updateHeaderModelLabel(selectedModel);

            try {
                engine = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (report) => {
                        statusText.innerText = report.text;
                    }
                });

                statusText.innerText = "Ready (Local)";
                isModelReady = true;
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = "<span>Send</span>";
                updateAttachmentSupport(selectedModel);
            } catch (error) {
                statusText.innerText = "Error loading model.";
                console.error(error);
                sendBtn.innerHTML = "<span>Failed</span>";
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            initChats();
            updateHeaderModelLabel(selectedModel);
            await initModel(selectedModel);
        });

        function initChats() {
            if (chats.length === 0) {
                createNewChat(false);
            } else {
                if (!currentChatId || !chats.some(c => c.id === currentChatId)) {
                    currentChatId = chats[0].id;
                }
                loadChatIntoView(currentChatId);
            }
            renderChatList();
        }

        function createNewChat(switchTo = true) {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'New Chat',
                messages: [{ role: "assistant", content: GREETING_TEXT }]
            };
            chats.unshift(newChat);
            saveChatsToStorage();

            if (switchTo) {
                currentChatId = newChat.id;
                loadChatIntoView(currentChatId);
                if (window.innerWidth <= 768) toggleSidebar();
            }
            renderChatList();
        }

        function saveChatsToStorage() {
            localStorage.setItem('ai_chats', JSON.stringify(chats));
            localStorage.setItem('ai_current_chat_id', currentChatId);
        }

        function loadChatIntoView(chatId) {
            currentChatId = chatId;
            saveChatsToStorage();
            chatContainer.innerHTML = '';
            
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                chat.messages.forEach(msg => {
                    appendMessageUI(msg.content, msg.role === 'user' ? 'user-message' : 'ai-message', msg.image);
                });
            }
            renderChatList();
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'chat-title';
                titleSpan.innerText = chat.title;
                titleSpan.addEventListener('click', () => {
                    loadChatIntoView(chat.id);
                    if (window.innerWidth <= 768) toggleSidebar();
                });

                const actions = document.createElement('div');
                actions.className = 'chat-actions';

                const renameBtn = document.createElement('button');
                renameBtn.className = 'action-btn';
                renameBtn.innerHTML = ICON_EDIT;
                renameBtn.title = 'Rename chat';
                renameBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showModal({
                        title: 'Rename Chat',
                        showInput: true,
                        defaultValue: chat.title,
                        confirmText: 'Save',
                        onConfirm: (newTitle) => {
                            if (newTitle && newTitle.trim()) {
                                chat.title = newTitle.trim();
                                saveChatsToStorage();
                                renderChatList();
                            }
                        }
                    });
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'action-btn';
                deleteBtn.innerHTML = ICON_DELETE;
                deleteBtn.title = 'Delete chat';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (chats.length === 1) {
                        showModal({
                            title: 'Cannot Delete',
                            message: 'You must keep at least one active chat session.',
                            confirmText: 'OK',
                            showCancel: false
                        });
                        return;
                    }

                    showModal({
                        title: 'Delete Chat',
                        message: `Are you sure you want to delete "${chat.title}"?`,
                        confirmText: 'Delete',
                        isDanger: true,
                        onConfirm: () => {
                            chats = chats.filter(c => c.id !== chat.id);
                            if (currentChatId === chat.id) {
                                currentChatId = chats[0].id;
                                loadChatIntoView(currentChatId);
                            } else {
                                saveChatsToStorage();
                                renderChatList();
                            }
                        }
                    });
                });

                actions.appendChild(renameBtn);
                actions.appendChild(deleteBtn);
                item.appendChild(titleSpan);
                item.appendChild(actions);
                chatListEl.appendChild(item);
            });
        }

        newChatBtn.addEventListener('click', () => createNewChat(true));

        async function sendMessage() {
            if (!isModelReady) return;
            let text = userInput.value.trim();
            const hasAttachment = attachedFile !== null;
            if (!text && !hasAttachment) return;

            if (hasAttachment && attachedFile.type === 'text') {
                text = `[Attached Document: ${attachedFile.name}]\n\`\`\`\n${attachedFile.content}\n\`\`\`\n\n${text}`;
            }

            const imagePayload = (hasAttachment && attachedFile.type === 'image') ? attachedFile.dataUrl : null;

            appendMessageUI(text, 'user-message', imagePayload);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            if (!attachBtn.disabled) attachBtn.disabled = true;

            const currentChat = chats.find(c => c.id === currentChatId);
            if (currentChat) {
                let userMessageContent = text;
                if (imagePayload && selectedModel.toLowerCase().includes('vision')) {
                    userMessageContent = [
                        { type: "text", text: text || "Describe this image." },
                        { type: "image_url", image_url: { url: imagePayload } }
                    ];
                }

                currentChat.messages.push({ role: "user", content: userMessageContent, image: imagePayload });
                if (currentChat.title === 'New Chat') {
                    currentChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                }
                saveChatsToStorage();
                renderChatList();
            }

            clearAttachment();
            const aiBubble = appendMessageUI("Thinking...", 'ai-message');

            try {
                let currentReply = "";
                const completion = await engine.chat.completions.create({
                    messages: currentChat.messages,
                    stream: true
                });

                for await (const chunk of completion) {
                    const delta = chunk.choices[0]?.delta?.content || "";
                    currentReply += delta;
                    aiBubble.innerText = currentReply;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }

                currentChat.messages.push({ role: "assistant", content: currentReply });
                saveChatsToStorage();

            } catch (e) {
                aiBubble.innerText = "Error producing a response locally.";
                console.error(e);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                updateAttachmentSupport(selectedModel);
                userInput.focus();
            }
        }

        function appendMessageUI(text, className, imageSrc = null) {
            const el = document.createElement('div');
            el.className = `message ${className}`;
            
            if (imageSrc) {
                const img = document.createElement('img');
                img.src = imageSrc;
                img.className = 'message-img';
                el.appendChild(img);
            }

            let displayString = text;
            if (Array.isArray(text)) {
                const textObj = text.find(t => t.type === 'text');
                displayString = textObj ? textObj.text : "";
            }

            const textSpan = document.createElement('div');
            textSpan.innerText = displayString;
            el.appendChild(textSpan);

            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return el;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
