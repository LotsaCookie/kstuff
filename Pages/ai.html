<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Study.com | K-12 Online Learning and Worksheet Portal" />
    <meta property="og:site_name" content="Study.com Learning" />
    <meta name="msapplication-TileColor" content="#00ffa6" />
    <meta property="og:image" content="https://www.ixl.com/dv3/powZqMuTE7du4asFrVyNGxxoqkw/yui3/opengraph/assets/general_us.png" />
    <meta name="description" content="Study.com is a trusted educational resource for K–12 students. Providing interactive worksheets, practice questions, and study guides." />
    <meta property="og:description" content="Study.com is a trusted educational resource for K–12 students. Providing interactive worksheets, practice questions, and study guides." />
    <title>Learning Assistant</title>
    <style>
        :root {
            --bg-color: rgba(0, 0, 0, 0.08);
            --chat-bg: rgba(0, 0, 0, 0.08);
            --sidebar-bg: rgba(0, 0, 0, 0.08);
            --text-color: #e3e3e3;
            --user-bubble: rgba(0, 0, 0, 0.08);
            --ai-bubble: rgba(0, 0, 0, 0.08);
            --accent-color: #a8c7fa;
            --input-bg: rgba(0, 0, 0, 0.08);
            --hover-color: rgba(0, 0, 0, 0.08);
            --danger-color: rgba(255, 100, 100, 0.2);
            --danger-text: #ff8b8b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: rgba(0, 0, 0, 0.08);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 280px;
            background-color: rgba(0, 0, 0, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: -280px;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        #sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
        }

        #new-chat-btn {
            background-color: rgba(0, 0, 0, 0.08);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 12px;
            border-radius: 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            transition: opacity 0.2s;
        }

        #new-chat-btn:hover {
            opacity: 0.9;
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-color);
            background-color: rgba(0, 0, 0, 0.08);
            transition: background 0.2s;
        }

        .chat-item:hover {
            background-color: rgba(0, 0, 0, 0.08);
        }

        .chat-item.active {
            background-color: rgba(0, 0, 0, 0.08);
            border-left: 4px solid var(--accent-color);
        }

        .chat-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 8px;
        }

        .chat-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-item:hover .chat-actions {
            opacity: 1;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9aa0a6;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .action-btn:hover {
            color: var(--text-color);
            background-color: rgba(0, 0, 0, 0.08);
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.08);
        }

        header {
            background-color: rgba(0, 0, 0, 0.08);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 40px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #menu-toggle {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        #menu-toggle:hover {
            background-color: rgba(0, 0, 0, 0.08);
        }

        #model-picker-btn {
            background-color: rgba(0, 0, 0, 0.08);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 6px 14px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.2s;
        }

        #model-picker-btn:hover {
            border-color: var(--accent-color);
        }

        #status-text {
            display: none;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: rgba(0, 0, 0, 0.08);
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
            background-color: rgba(0, 0, 0, 0.08);
        }

        .user-message {
            background-color: rgba(0, 0, 0, 0.08);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ai-message {
            background-color: rgba(0, 0, 0, 0.08);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .error-message {
            background-color: rgba(255, 0, 0, 0.15);
            color: #ff8b8b;
            border: 1px solid rgba(255, 0, 0, 0.3);
            font-family: monospace;
            font-size: 0.85rem;
        }

        .message-img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
        }

        #attachment-preview {
            display: none;
            padding: 8px 15px 0 15px;
            background-color: rgba(0, 0, 0, 0.08);
            gap: 8px;
            align-items: center;
        }

        .preview-chip {
            background-color: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .preview-chip img {
            width: 24px;
            height: 24px;
            object-fit: cover;
            border-radius: 4px;
        }

        .remove-attachment {
            background: rgba(0, 0, 0, 0.08);
            border: none;
            color: #9aa0a6;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-attachment:hover {
            color: var(--danger-text);
        }

        #input-container {
            background-color: rgba(0, 0, 0, 0.08);
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            align-items: center;
        }

        #attach-btn {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }

        #attach-btn:hover:not(:disabled) {
            background-color: rgba(0, 0, 0, 0.08);
            color: var(--accent-color);
        }

        #attach-btn:disabled {
            color: #555558;
            cursor: not-allowed;
        }

        textarea {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.08);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 12px 20px;
            resize: none;
            height: 24px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        textarea:focus { border-color: var(--accent-color); }

        button#send-btn {
            background-color: rgba(0, 0, 0, 0.08);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button#send-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            z-index: 999;
        }
        #overlay.active { display: block; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background-color: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 24px;
            width: 85%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-box h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        .modal-box p { margin: 0; font-size: 0.95rem; color: #9aa0a6; line-height: 1.4; }
        .modal-box input {
            background-color: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.95rem;
            outline: none;
        }
        .modal-box input:focus { border-color: var(--accent-color); }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 6px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(0, 0, 0, 0.08);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-btn:hover { opacity: 0.85; }
        .modal-btn.primary { background-color: rgba(0, 0, 0, 0.08); }
        .modal-btn.secondary { background-color: rgba(0, 0, 0, 0.08); }
        .modal-btn.danger { background-color: var(--danger-color); color: var(--danger-text); border-color: rgba(255, 100, 100, 0.3); }

        #model-modal-box {
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            background-color: rgba(0, 0, 0, 0.08);
        }

        .model-list-container {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 50vh;
            padding-right: 4px;
        }

        .model-category-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-color);
            margin: 6px 0 2px 0;
            font-weight: bold;
        }

        .model-option-card {
            background-color: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .model-option-card:hover {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.08);
        }

        .model-option-card.selected {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.08);
        }

        .model-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-card-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        .model-card-tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-color);
            font-weight: 500;
        }

        .model-card-desc {
            font-size: 0.8rem;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Chat History</h3>
        </div>
        <div style="padding: 10px;">
            <button id="new-chat-btn">+ New Chat</button>
        </div>
        <div id="chat-list"></div>
    </div>
    <div id="overlay"></div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">Title</h3>
            <p id="modal-message" style="display: none;"></p>
            <input type="text" id="modal-input" style="display: none;" />
            <div class="modal-buttons">
                <button id="modal-cancel-btn" class="modal-btn secondary">Cancel</button>
                <button id="modal-confirm-btn" class="modal-btn primary">Confirm</button>
            </div>
        </div>
    </div>

    <div id="model-modal-overlay" class="modal-overlay">
        <div class="modal-box" id="model-modal-box">
            <h3>Select AI Model</h3>
            <p style="margin: 0;">Choose a model to load locally into your browser:</p>
            <div class="model-list-container" id="model-list-container"></div>
            <div class="modal-buttons" style="justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; margin-top: 4px;">
                <button id="clear-cache-btn" class="modal-btn danger">Clear Model Cache</button>
                <button id="model-modal-close" class="modal-btn secondary">Close</button>
            </div>
        </div>
    </div>

    <div id="main-content">
        <header>
            <div class="header-left">
                <button id="menu-toggle" title="Open menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <button id="model-picker-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span id="current-model-label">Select Model</span>
                </button>
            </div>
            <span id="status-text">Initializing engine...</span>

        <div id="chat-container">
            <!-- Messages render here -->
        </div>

        <div id="attachment-preview"></div>

        <div id="input-container">

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <button id="send-btn" disabled>
                <div class="spinner"></div>
                <span>Loading</span>
            </button>
        </div>
    </div>

        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        const GREETING_TEXT = "Hello, how may I assist you?";
        
        let engine;
        let chats = JSON.parse(localStorage.getItem('ai_chats')) || [];

        let selectedModel = localStorage.getItem('ai_selected_model') || "Llama-3.2-1B-Instruct-q4f16_1-MLC";
        let attachedFile = null;

        const modelModalClose = document.getElementById('model-modal-close');

        const clearCacheBtn = document.getElementById('clear-cache-btn');

        let isModelReady = false;

        const AVAILABLE_MODELS = [

            { id: "Llama-3.2-3B-Instruct-q4f16_1-MLC", name: "Llama 3.2 (3B)", tag: "Bite-Sized", category: "Bite-Sized & Mobile-Friendly", desc: "Great balance of speed and reasoning." },
            { id: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC", name: "Qwen 2.5 (1.5B)", tag: "Bite-Sized", category: "Bite-Sized & Mobile-Friendly", desc: "Strong multilingual and coding performance." },
            { id: "SmolLM2-1.7B-Instruct-q4f16_1-MLC", name: "SmolLM2 (1.7B)", tag: "Bite-Sized", category: "Bite-Sized & Mobile-Friendly", desc: "Compact model optimized for everyday tasks." },

            { id: "Gemma-2-9b-it-q4f16_1-MLC", name: "Gemma 2 (9B)", tag: "Desktop Heavy", category: "Standard Desktop Models", desc: "Advanced capabilities for powerful devices." },
            { id: "Llama-3.2-11B-Vision-Instruct-q4f16_1-MLC", name: "Llama 3.2 Vision (11B)", tag: "Multimodal", category: "Multimodal Vision Models", desc: "Supports images, documents, and visual reasoning." }
        ];

        const ICON_EDIT = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>`;
        const ICON_DELETE = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;

        function saveChats() {
            localStorage.setItem('ai_chats', JSON.stringify(chats));
            if (currentChatId) {
                localStorage.setItem('ai_current_chat_id', currentChatId);
            } else {
                localStorage.removeItem('ai_current_chat_id');
            }
        }

        function renderChatList() {
            chatListEl.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerHTML = `
                    <span class="chat-title">${chat.title}</span>
                    <div class="chat-actions">
                        <button class="action-btn edit-btn" title="Rename">${ICON_EDIT}</button>
                        <button class="action-btn delete-btn" title="Delete">${ICON_DELETE}</button>
                    </div>
                `;
                
                // Rename Chat
                item.querySelector('.edit-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    showModal({
                        title: 'Rename Chat',
                        showInput: true,
                        defaultValue: chat.title,
                        confirmText: 'Save',
                        onConfirm: (newTitle) => {
                            if (newTitle && newTitle.trim()) {
                                chat.title = newTitle.trim();
                                saveChats();
                                renderChatList();
                            }
                        }
                    });
                });

                // Delete Chat
                item.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    showModal({
                        title: 'Delete Chat',
                        message: 'Are you sure you want to delete this chat?',
                        confirmText: 'Delete',
                        isDanger: true,
                        onConfirm: () => {
                            chats = chats.filter(c => c.id !== chat.id);
                            if (currentChatId === chat.id) {
                                currentChatId = chats.length ? chats[0].id : null;
                                if (currentChatId) loadChat(currentChatId);
                                else createNewChat();
                            }
                            saveChats();
                            renderChatList();
                        }
                    });
                });

                // Load Chat
                item.addEventListener('click', () => {
                    if (window.innerWidth <= 768) toggleSidebar();
                    loadChat(chat.id);
                });

                chatListEl.appendChild(item);
            });
        }

        function createNewChat() {
            currentChatId = Date.now().toString();
            chats.unshift({ id: currentChatId, title: 'New Chat', messages: [] });
            saveChats();
            renderChatList();
            loadChat(currentChatId);
        }

        function loadChat(id) {
            currentChatId = id;
            saveChats();
            renderChatList();
            chatContainer.innerHTML = '';
            
            const chat = chats.find(c => c.id === id);
            if (!chat || chat.messages.length === 0) {
                addMessageToUI('ai', GREETING_TEXT);
                return;
            }

            chat.messages.forEach(msg => {
                let contentText = "";
                let imgUrl = null;

                if (typeof msg.content === 'string') {
                    contentText = msg.content;
                } else if (Array.isArray(msg.content)) {
                    const textPart = msg.content.find(p => p.type === 'text');
                    const imgPart = msg.content.find(p => p.type === 'image_url');
                    if (textPart) contentText = textPart.text;
                    if (imgPart) imgUrl = imgPart.image_url.url;
                }
                addMessageToUI(msg.role === 'user' ? 'user' : 'ai', contentText, imgUrl);
            });
            scrollToBottom();
        }

        function addMessageToUI(role, text, imageUrl = null, isError = false) {
            const msgDiv = document.createElement('div');
            let className = role === 'user' ? 'user-message' : 'ai-message';
            if (isError) className += ' error-message';
            
            msgDiv.className = `message ${className}`;
            
            let html = '';
            if (imageUrl) {
                html += `<img src="${imageUrl}" class="message-img" />`;
            }
            
            const formattedText = text
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') 
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/```([\s\S]*?)```/g, '<pre style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; overflow-x: auto;"><code>$1</code></pre>')
                .replace(/`(.*?)`/g, '<code style="background: rgba(0,0,0,0.2); padding: 2px 4px; border-radius: 4px;">$1</code>')
                .replace(/\n/g, '<br>');
                
            html += `<div>${formattedText}</div>`;
            msgDiv.innerHTML = html;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv; 
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // === CHAT SEND & RECEIVE LOGIC ===
        
        async function sendMessage() {
            const text = userInput.value.trim();
            if ((!text && !attachedFile) || !isModelReady) return;

            if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                createNewChat();
            }

            const chat = chats.find(c => c.id === currentChatId);
            
            let messageContent;
            let uiImageUrl = null;

            if (attachedFile) {
                if (attachedFile.type === 'image') {
                    messageContent = [
                        { type: "text", text: text || "Describe this image." },
                        { type: "image_url", image_url: { url: attachedFile.dataUrl } }
                    ];
                    uiImageUrl = attachedFile.dataUrl;
                } else if (attachedFile.type === 'text') {
                    const combinedText = `Attached File (${attachedFile.name}):\n\`\`\`\n${attachedFile.content}\n\`\`\`\n\nUser Input: ${text}`;
                    messageContent = combinedText;
                }
            } else {
                messageContent = text;
            }

            addMessageToUI('user', text, uiImageUrl);
            chat.messages.push({ role: 'user', content: messageContent });
            
            if (chat.title === 'New Chat' && text) {
                chat.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
                renderChatList();
            }
            saveChats();

            userInput.value = '';
            userInput.style.height = '24px';
            clearAttachment();
            
            userInput.disabled = true;
            sendBtn.disabled = true;
            attachBtn.disabled = true;
            sendBtn.innerHTML = `<div class="spinner"></div><span>Thinking</span>`;

            try {
                const messagesForEngine = [
                    { role: "system", content: "You are a helpful AI assistant." },
                    ...chat.messages.map(m => ({
                        role: m.role,
                        content: m.content
                    }))
                ];

                const asyncChunkGenerator = await engine.chat.completions.create({
                    messages: messagesForEngine,
                    stream: true,
                    temperature: 0.7
                });

                const aiMsgBubble = addMessageToUI('ai', '');
                let aiFullResponse = "";

                for await (const chunk of asyncChunkGenerator) {
                    const delta = chunk.choices[0]?.delta?.content || "";
                    aiFullResponse += delta;
                    
                    const formattedDelta = aiFullResponse
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/```([\s\S]*?)```/g, '<pre style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; overflow-x: auto;"><code>$1</code></pre>')
                        .replace(/`(.*?)`/g, '<code style="background: rgba(0,0,0,0.2); padding: 2px 4px; border-radius: 4px;">$1</code>')
                        .replace(/\n/g, '<br>');
                        
                    aiMsgBubble.innerHTML = `<div>${formattedDelta}</div>`;
                    scrollToBottom();
                }

                chat.messages.push({ role: 'assistant', content: aiFullResponse });
                saveChats();

            } catch (error) {
                console.error("Inference Error:", error);
                const errorText = error.message || String(error);
                addMessageToUI('ai', `**Inference Error:**<br>${errorText}<br><br>*Tip: If this says 'Out of Memory', try switching to a smaller model in the top menu or starting a new chat.*`, null, true);
                
                chat.messages.pop();
                saveChats();
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = "<span>Send</span>";
                updateAttachmentSupport(selectedModel);
                userInput.focus();
            }
        }

        // === MODALS & ATTACHMENT LOGIC ===

        function renderModelModalOptions() {
            modelListContainer.innerHTML = '';
            
            const categories = [...new Set(AVAILABLE_MODELS.map(m => m.category))];
            categories.forEach(cat => {
                const catTitle = document.createElement('div');
                catTitle.className = 'model-category-title';
                catTitle.innerText = cat;
                modelListContainer.appendChild(catTitle);

                const modelsInCat = AVAILABLE_MODELS.filter(m => m.category === cat);
                modelsInCat.forEach(model => {
                    const card = document.createElement('div');
                    card.className = `model-option-card ${model.id === selectedModel ? 'selected' : ''}`;
                    card.innerHTML = `
                        <div class="model-card-header">
                            <span class="model-card-name">${model.name}</span>
                            <span class="model-card-tag">${model.tag}</span>
                        </div>
                        <span class="model-card-desc">${model.desc}</span>
                    `;

                    card.addEventListener('click', () => {
                        closeModelModal();
                        if (model.id !== selectedModel) {
                            showModal({
                                title: 'Download & Load Model',
                                message: `Switch model to "${model.name}"? This will download/load the model locally into your browser.`,
                                confirmText: 'Download & Load',
                                onConfirm: () => {
                                    initModel(model.id);
                                }
                            });
                        }
                    });

                    modelListContainer.appendChild(card);
                });
            });
        }

        function openModelModal() {
            renderModelModalOptions();
            modelModalOverlay.classList.add('active');
        }

        function closeModelModal() {
            modelModalOverlay.classList.remove('active');
        }

        modelPickerBtn.addEventListener('click', openModelModal);
        modelModalClose.addEventListener('click', closeModelModal);
        modelModalOverlay.addEventListener('click', (e) => {
            if (e.target === modelModalOverlay) closeModelModal();
        });
        clearCacheBtn.addEventListener('click', () => {
            closeModelModal();
            showModal({
                title: 'Clear AI Model Cache',
                message: 'This will purge all downloaded WebLLM AI model weights from your device memory. Your chat history will not be deleted.',
                confirmText: 'Clear Model Cache',
                isDanger: true,
                onConfirm: async () => {
                    statusText.innerText = "Clearing model cache...";
                    try {
                        // WebLLM native clear cache
                        if (webllm.clearModelCache) {
                            await webllm.clearModelCache();
                        } else {
                            // Manual fallback purge for WebLLM cache stores
                            const cacheNames = await caches.keys();
                            for (const name of cacheNames) {
                                if (name.includes('webllm') || name.includes('mlc') || name.includes('wasm')) {
                                    await caches.delete(name);
                                }
                            }
                        }
                        showModal({
                            title: 'Cache Cleared',
                            message: 'Model cache purged successfully. Re-select a model to download fresh weights.',
                            confirmText: 'OK',
                            showCancel: false,
                            onConfirm: () => { window.location.reload(); }
                        });
                    } catch (err) {
                        console.error("Cache Clear Error:", err);
                        showModal({
                            title: 'Error',
                            message: 'Failed to clear model cache: ' + err.message,
                            confirmText: 'OK',
                            showCancel: false
                        });
                    }
                }
            });
        });

        function updateHeaderModelLabel(modelId) {
            const found = AVAILABLE_MODELS.find(m => m.id === modelId);
            currentModelLabel.innerText = found ? found.name : "Select Model";
        }

        function updateAttachmentSupport(modelId) {
            const isVisionModel = modelId.toLowerCase().includes('vision');
            if (isVisionModel && isModelReady) {
                attachBtn.disabled = false;
            } else {
                attachBtn.disabled = true;
                clearAttachment();
            }
        }

        attachBtn.addEventListener('click', () => {
            if (!attachBtn.disabled) fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            if (file.type.startsWith('image/')) {
                reader.onload = function(uploadEvent) {
                    attachedFile = {
                        type: 'image',
                        name: file.name,
                        dataUrl: uploadEvent.target.result
                    };
                    renderAttachmentPreview();
                };
                reader.readAsDataURL(file);
            } else {
                reader.onload = function(uploadEvent) {
                    attachedFile = {
                        type: 'text',
                        name: file.name,
                        content: uploadEvent.target.result
                    };
                    renderAttachmentPreview();
                };
                reader.readAsText(file);
            }
        });

        function renderAttachmentPreview() {
            if (!attachedFile) {
                attachmentPreview.style.display = 'none';
                attachmentPreview.innerHTML = '';
                return;
            }

            attachmentPreview.style.display = 'flex';
            attachmentPreview.innerHTML = `
                <div class="preview-chip">
                    ${attachedFile.type === 'image' ? `<img src="${attachedFile.dataUrl}" />` : `<span>📄</span>`}
                    <span style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${attachedFile.name}</span>
                    <button class="remove-attachment" id="remove-file-btn">×</button>
                </div>
            `;
            document.getElementById('remove-file-btn').addEventListener('click', clearAttachment);
        }

        function clearAttachment() {
            attachedFile = null;
            fileInput.value = '';
            attachmentPreview.style.display = 'none';
            attachmentPreview.innerHTML = '';
        }

        function showModal({ title, message, showInput, defaultValue, confirmText, isDanger, showCancel = true, onConfirm }) {
            const modalOverlay = document.getElementById('modal-overlay');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');
            const inputEl = document.getElementById('modal-input');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            titleEl.innerText = title;
            if (message) { msgEl.innerText = message; msgEl.style.display = 'block'; }
            else { msgEl.style.display = 'none'; }

            if (showInput) {
                inputEl.value = defaultValue || '';
                inputEl.style.display = 'block';
                setTimeout(() => inputEl.focus(), 100);
            } else {
                inputEl.style.display = 'none';
            }

            cancelBtn.style.display = showCancel ? 'block' : 'none';
            confirmBtn.innerText = confirmText || 'Confirm';
            confirmBtn.className = `modal-btn ${isDanger ? 'danger' : 'primary'}`;
            modalOverlay.classList.add('active');

            const closeModal = () => {
                modalOverlay.classList.remove('active');
                confirmBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            cancelBtn.onclick = closeModal;
            confirmBtn.onclick = () => {
                const val = showInput ? inputEl.value : null;
                closeModal();
                if (onConfirm) onConfirm(val);
            };
            if (showInput) {
                inputEl.onkeydown = (e) => { if (e.key === 'Enter') confirmBtn.click(); };
            }
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // === WEBLLM INITIALIZATION ===

        async function initModel(modelId) {
            isModelReady = false;
            userInput.disabled = true;
            sendBtn.disabled = true;
            attachBtn.disabled = true;
            sendBtn.innerHTML = `<div class="spinner"></div><span>Loading</span>`;

            selectedModel = modelId;
            localStorage.setItem('ai_selected_model', selectedModel);
            updateHeaderModelLabel(selectedModel);

            try {
                engine = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (report) => {
                        statusText.innerText = report.text;
                    }
                });

                statusText.innerText = "Ready (Local)";
                isModelReady = true;
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = "<span>Send</span>";
                updateAttachmentSupport(selectedModel);
            } catch (error) {
                statusText.innerText = "Error loading model.";
                console.error(error);
                sendBtn.innerHTML = "<span>Failed</span>";
            }
        }
        window.addEventListener('DOMContentLoaded', async () => {
            renderChatList();
            if (chats.length > 0) {
                if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                    currentChatId = chats[0].id;
                }
                loadChat(currentChatId);
            } else {
                addMessageToUI('ai', GREETING_TEXT);
            }

            sendBtn.addEventListener('click', sendMessage);
            
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            userInput.addEventListener('input', function() {
                this.style.height = '24px';
                this.style.height = (this.scrollHeight) + 'px';
            });

            newChatBtn.addEventListener('click', () => {
                if (window.innerWidth <= 768) toggleSidebar();
                createNewChat();
            });

            await initModel(selectedModel);
        });
    </script>
</body>
</html>
