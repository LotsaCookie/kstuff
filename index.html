<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study.com</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
     window.addEventListener("beforeunload", (event) => {
        event.preventDefault();
        event.returnValue = "";
    });
    </script>
    <script>
        (async function(){
            let commitHash = 'main'; // Safe fallback
            try {
                const res = await fetch('https://api.github.com/repos/lotsacookie/kstuff/commits/main');
                if (res.ok) {
                    const data = await res.json();
                    commitHash = data.sha; // Gets the unique commit hash (e.g., 'a1b2c3d...')
                }
            } catch (e) {
                console.warn("API check failed, using 'main' branch fallback.");
            }

            const p = [
                "https://raw.githubusercontent.com/lotsacookie/kstuff/main/",
                "https://raw.githack.com/lotsacookie/kstuff/main/",
                `https://cdn.jsdelivr.net/gh/lotsacookie/kstuff@${commitHash}/`,
                "https://cdn.statically.io/gh/lotsacookie/kstuff/main/",
                ""
            ];

            function l(f, s) {
                let i = 0;
                const cacheBuster = "?i_=" + Date.now();
                function t() {
                    let e = document.createElement(s ? 'script' : 'link');
                    let currentProxy = p[i];
                    let targetUrl = currentProxy ? (currentProxy + f + cacheBuster) : (f + cacheBuster);

                    if (s) { e.src = targetUrl; } 
                    else { e.rel = 'stylesheet'; e.href = targetUrl; }

                    if (i >= p.length - 1) {
                        document.head.appendChild(e);
                        return;
                    }

                    e.onerror = () => {
                        e.remove();
                        i++;
                        t();
                    };
                    document.head.appendChild(e);
                }
                t();
            }
            l('style.css', 0);
            l('script.js', 1);
        })();
    </script>
</head>
<body class="theme-sakura nav-left text-hide size-small">
    <div id="app-container">
        <nav id="navbar">
            <div id="nav-logo">K</div>
            <button class="nav-btn active" data-target="home">
                <i class="ph ph-house"></i> <span>Home</span>
            </button>
            <button class="nav-btn" data-target="games">
                <i class="ph ph-game-controller"></i> <span>Games</span>
            </button>
            <button class="nav-btn" data-target="apps">
                <i class="ph ph-app-window"></i> <span>Apps</span>
            </button>
            <button class="nav-btn" data-target="music">
                <i class="ph ph-music-notes"></i> <span>Music</span>
            </button>
            <button class="nav-btn" data-target="ai">
                <i class="ph ph-robot"></i> <span>AI</span>
            </button>
            
            <!-- Divider -->
            <div class="nav-divider"></div>

            <button class="nav-btn" data-target="settings">
                <i class="ph ph-gear"></i> <span>Settings</span>
            </button>
        </nav>
        <main id="content-area">
            <section id="home" class="page active">
                <iframe id="home-iframe" class="full-page-iframe" allowfullscreen></iframe>
            </section>
            <section id="games" class="page">
                <div class="filter-bar">
                    <div class="modern-select-wrapper search-wrapper">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" id="games-search" class="modern-input" placeholder="Search games...">
                    </div>
                    <div class="modern-select-wrapper">
                        <i class="ph ph-funnel"></i>
                        <select id="games-category-select" class="modern-select">
                            <option value="All">Loading Categories...</option>
                        </select>
                    </div>
                </div>
                <div class="item-grid" id="games-grid"></div>
                <div class="pagination-bar" id="games-pagination"></div>
            </section>
            <section id="apps" class="page">
                <div class="filter-bar">
                    <div class="modern-select-wrapper search-wrapper">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" id="apps-search" class="modern-input" placeholder="Search apps...">
                    </div>
                    <div class="modern-select-wrapper">
                        <i class="ph ph-funnel"></i>
                        <select id="apps-category-select" class="modern-select">
                            <option value="All">Loading Categories...</option>
                        </select>
                    </div>
                </div>
                <div class="item-grid" id="apps-grid"></div>
                <div class="pagination-bar" id="apps-pagination"></div>
            </section>
            <section id="music" class="page">
                <iframe id="music-iframe" class="full-page-iframe" allowfullscreen></iframe>
            </section>
            <section id="ai" class="page">
                <iframe id="ai-iframe" class="full-page-iframe" allowfullscreen></iframe>
            </section>
        </main>
    </div>

    <!-- Content Modal -->
    <div id="content-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-title"></span>
                <div class="modal-actions">
                    <button id="modal-fullscreen-btn" title="Toggle Fullscreen"><i class="ph ph-corners-out"></i></button>
                    <button id="modal-close-btn" title="Close"><i class="ph ph-x"></i></button>
                </div>
            </div>
            <iframe id="modal-iframe" src=""></iframe>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content settings-modal-content">
            <div class="modal-header">
                <span id="settings-modal-title"><i class="ph ph-gear"></i> Settings</span>
                <div class="modal-actions">
                    <button id="settings-modal-close-btn" title="Close"><i class="ph ph-x"></i></button>
                </div>
            </div>
            <div class="settings-card modal-settings-body">
                <div class="setting-group">
                    <label for="theme-select"><i class="ph ph-palette"></i> App Theme</label>
                    <select id="theme-select">
                        <option value="theme-sakura" selected>Sakura</option>
                        <option value="theme-dark">Dark</option>
                        <option value="theme-light">Light</option>
                        <option value="theme-ocean">Ocean</option>
                        <option value="theme-sunset">Sunset</option>
                        <option value="theme-emerald">Emerald</option>
                        <option value="theme-midnight">Midnight</option>
                        <option value="theme-cyber">Cyber</option>
                        <option value="theme-ruby">Ruby</option>
                        <option value="theme-latte">Latte</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="nav-select"><i class="ph ph-layout"></i> Navbar Position</label>
                    <select id="nav-select">
                        <option value="nav-top">Top</option>
                        <option value="nav-left" selected>Left</option>
                        <option value="nav-right">Right</option>
                        <option value="nav-bottom">Bottom</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="text-select"><i class="ph ph-text-aa"></i> Nav Text Visibility</label>
                    <select id="text-select">
                        <option value="text-show">Show</option>
                        <option value="text-hide" selected>Hide</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="size-select"><i class="ph ph-bounding-box"></i> Nav Button Size</label>
                    <select id="size-select">
                        <option value="size-small" selected>Small</option>
                        <option value="size-medium">Medium</option>
                        <option value="size-large">Large</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
