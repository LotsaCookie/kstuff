<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study.com - Math, Language Arts, Science</title>
    <meta property="og:title" content="Study.com | K-12 Online Learning and Worksheet Portal" />
    <meta property="og:site_name" content="Study.com Learning" />
    <meta name="msapplication-TileColor" content="#00ffa6" />
    <meta property="og:image" content="https://www.ixl.com/dv3/powZqMuTE7du4asFrVyNGxxoqkw/yui3/opengraph/assets/general_us.png" />
    <meta name="description" content="Study.com is a trusted educational resource for K–12 students. Providing interactive worksheets, practice questions, and study guides." />
    <meta property="og:description" content="Study.com is a trusted educational resource for K–12 students. Providing interactive worksheets, practice questions, and study guides." />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
     window.addEventListener("beforeunload", (event) => {
        event.preventDefault();
        event.returnValue = "";
    });
    </script>
    <script>
        (async function(){
            let commitHash = 'main'; // Safe fallback
            try {
                const res = await fetch('https://api.github.com/repos/lotsacookie/kstuff/commits/main');
                if (res.ok) {
                    const data = await res.json();
                    commitHash = data.sha; // Gets the unique commit hash (e.g., 'a1b2c3d...')
                }
            } catch (e) {
                console.warn("API check failed, using 'main' branch fallback.");
            }

            const p = [
                "https://raw.githubusercontent.com/lotsacookie/kstuff/main/",
                "https://raw.githack.com/lotsacookie/kstuff/main/",
                `https://cdn.jsdelivr.net/gh/lotsacookie/kstuff@${commitHash}/`,
                "https://cdn.statically.io/gh/lotsacookie/kstuff/main/",
                ""
            ];

            function l(f, s) {
                let i = 0;
                const cacheBuster = "?i_=" + Date.now();
                function t() {
                    let e = document.createElement(s ? 'script' : 'link');
                    let currentProxy = p[i];
                    let targetUrl = currentProxy ? (currentProxy + f + cacheBuster) : (f + cacheBuster);

                    if (s) { e.src = targetUrl; } 
                    else { e.rel = 'stylesheet'; e.href = targetUrl; }

                    if (i >= p.length - 1) {
                        document.head.appendChild(e);
                        return;
                    }

                    e.onerror = () => {
                        e.remove();
                        i++;
                        t();
                    };
                    document.head.appendChild(e);
                }
                t();
            }
            l('style.css', 0);
            l('script.js', 1);
        })();
    </script>
</head>
<body class="theme-sakura nav-left text-hide size-small">
    <div id="classroom-portal-container">
        <nav id="teachertouchbar">
            <div id="edu-logo">T</div>
            <button class="nav-btn active" data-target="mathworksheets" title="Math Worksheets">

            </button>
            <button class="nav-btn" data-target="readingcorner" title="Reading Corner">

            </button>
            <button class="nav-btn" data-target="gradebook" title="Gradebook">

            </button>
            <button class="nav-btn" data-target="lessonplanner" title="Lesson Planner">

            <!-- Divider -->

            <button class="nav-btn" data-target="homeworkhelper" title="Homework Helper">

            </button>
        </nav>
        <main id="studymaterial-area">
            <section id="mathworksheets" class="page active">

                        </select>
                    </div>
                </div>
                <div class="item-grid" id="readingcorner-grid"></div>
                <div class="pagination-bar" id="readingcorner-pagination"></div>
            </section>
            <section id="sciencequiz" class="page">
                <div class="filter-bar">
                    <div class="modern-select-wrapper search-wrapper">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" id="sciencequiz-search" class="modern-input" placeholder="Search modules...">
                    </div>
                    <div class="modern-select-wrapper">
                        <i class="ph ph-funnel"></i>
                        <select id="sciencequiz-category-select" class="modern-select">

                        </select>
                    </div>

            </section>
            <section id="gradebook" class="page">

            <section id="lessonplanner" class="page">

            </section>

    <!-- Content Modal -->

                        <option value="theme-ocean">Ocean</option>
                        <option value="theme-sunset">Sunset</option>
                        <option value="theme-emerald">Emerald</option>
                        <option value="theme-midnight">Midnight</option>
                        <option value="theme-cyber">Cyber</option>
                        <option value="theme-ruby">Ruby</option>
                        <option value="theme-latte">Latte</option>
                    </select>
                </div>
                <div class="setting-group">

                    <select id="layout-nav-select">
                        <option value="nav-top">Top</option>
                        <option value="nav-left" selected>Left</option>
                        <option value="nav-right">Right</option>
                        <option value="nav-bottom">Bottom</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="layout-text-select"><i class="ph ph-text-aa"></i> Nav Text Visibility</label>
                    <select id="layout-text-select">
                        <option value="text-show">Show</option>
                        <option value="text-hide" selected>Hide</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="layout-size-select"><i class="ph ph-bounding-box"></i> Nav Button Size</label>
                    <select id="layout-size-select">
                        <option value="size-small" selected>Small</option>
                        <option value="size-medium">Medium</option>
                        <option value="size-large">Large</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
